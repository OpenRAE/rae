  # Package publication is a supply-chain trust boundary in its own right and
  # does not depend on the reusable-asset phases: the OIDC publishing path and
  # its exact-SHA gates ship independently (#1227).
  - id: trusted-package-publishing
    requirements:
      - GOV-928
  - id: semantic-migration
    requirements:
      - GOV-903
    blocked_until:
      - gov-concept-authority
  # Published-schema evidence is a property of the normative contract surface
  # itself, so it depends on no other phase: the coverage gate reads the
  # publication catalog, the corpus router, and the assurance fulfillment map
  # that already exist (#1330). No ownership list, because the gate's evidence
  # repairs legitimately land in any contract family's corpus.
  - id: published-schema-coverage
    requirements:
      - ASR-501

