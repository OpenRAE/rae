# ADR-117 / MOD-001: import-linter contracts for the RAES packages.
#
# tools/check_repo_policy.py runs these contracts through import-linter and grimp
# from the locked tooling environment, and `lint-imports --config
# tools/policy/import_contracts.toml` runs them by hand. The root packages are the
# module_boundaries package coverage. Imports under TYPE_CHECKING do not run, so
# they are excluded; imports inside functions are included.
#
# Each ignore_imports list is exact structural debt (ADR-117 section 2). It can
# only shrink. When a change removes an import, remove its entry. Do not add an
# entry: remove the new import or the new cycle instead.

[tool.importlinter]
root_packages = [
    "raes",
    "raes_backend_protocols",
    "raes_backend_stubs",
    "raes_cli",
    "raes_conformance",
    "raes_contracts",
    "raes_mcp",
    "raes_operations",
    "raes_processor",
    "raes_runtime",
]
include_external_packages = false
exclude_type_checking_imports = true

# Package order, from high to low. It agrees with module_boundaries (ADR-036).
# The debt is the raes_contracts -> raes imports that ADR-036 allows but that
# form a cycle with raes -> raes_contracts.
[[tool.importlinter.contracts]]
id = "raes-package-layers"
name = "RAES packages depend downward (ADR-036, ADR-117)"
type = "layers"
layers = [
    "raes_cli",
    "raes_conformance | raes_mcp",
    "raes_backend_stubs",
    "raes_runtime",
    "raes_processor | raes_operations",
    "raes_backend_protocols",
    "raes",
    "raes_contracts",
]
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    "raes_contracts._behavioral_profile_loader -> raes.identifiers",
    "raes_contracts.artifact_requirements -> raes.artifact_requirements",
    "raes_contracts.associated_artifacts -> raes",
    "raes_contracts.associated_artifacts -> raes.scenario",
    "raes_contracts.authoring_adapters -> raes.identifiers",
    "raes_contracts.contracts.admitted_trial_plan_components -> raes.identifiers",
    "raes_contracts.contracts.bundle -> raes.canonical",
    "raes_contracts.contracts.bundle -> raes.materialization",
    "raes_contracts.contracts.bundle -> raes.scenario",
    "raes_contracts.contracts.difficulty_adaptation -> raes.identifiers",
    "raes_contracts.contracts.difficulty_governance -> raes.identifiers",
    "raes_contracts.contracts.difficulty_observations -> raes.identifiers",
