# ADR-117 / MOD-001: import-linter contracts for the RAES packages.
#
# tools/check_repo_policy.py runs these contracts through import-linter and grimp
# from the locked tooling environment, and `lint-imports --config
# tools/policy/import_contracts.toml` runs them by hand. The root packages are the
# module_boundaries package coverage. Imports under TYPE_CHECKING do not run, so
# they are excluded; imports inside functions are included.
#
# Each ignore_imports list is exact structural debt (ADR-117 section 2). It can
# only shrink. When a change removes an import, remove its entry. Do not add an
# entry: remove the new import or the new cycle instead.

[tool.importlinter]
root_packages = [
    "raes",
    "raes_backend_protocols",
    "raes_backend_stubs",
    "raes_cli",
    "raes_conformance",
    "raes_contracts",
    "raes_mcp",
    "raes_operations",
    "raes_processor",
    "raes_runtime",
    "raes_schemas",
]
include_external_packages = false
exclude_type_checking_imports = true

# Package order, from high to low. It agrees with module_boundaries (ADR-036).
# ADR-121: raes_contracts is the lowest package, so this contract has no
# import debt. raes_schemas composes the published schemas above the processor.
[[tool.importlinter.contracts]]
id = "raes-package-layers"
name = "RAES packages depend downward (ADR-036, ADR-117)"
type = "layers"
layers = [
    "raes_cli",
    "raes_conformance | raes_mcp",
    "raes_backend_stubs",
    "raes_runtime | raes_schemas",
    "raes_processor | raes_operations",
    "raes_backend_protocols",
    "raes",
    "raes_contracts",
]
unmatched_ignore_imports_alerting = "error"
ignore_imports = []

# No cycles between the children of a package, at each depth. The debt is the
# cycle breakers that grimp nominated on the adoption commit and that are on a
# cycle.
[[tool.importlinter.contracts]]
id = "raes-sibling-cycles"
name = "No import cycles between sibling modules (ADR-117)"
type = "acyclic_siblings"
ancestors = [
    "raes",
    "raes_backend_protocols",
    "raes_backend_stubs",
    "raes_cli",
    "raes_conformance",
    "raes_contracts",
    "raes_mcp",
    "raes_operations",
    "raes_processor",
    "raes_runtime",
    "raes_schemas",
]
depth = 10
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    "raes._composition_provenance -> raes.module_registry",
    "raes._declarations -> raes._declaration_adders",
    "raes._declarations -> raes._declaration_index",
    "raes._module_declarations -> raes.module_registry._digests",
    "raes._realization_envelope_projection -> raes.realization_envelope",
    "raes.composition._import_admission -> raes.validator",
    "raes.instantiate -> raes.canonical",
    "raes.instantiate -> raes.validator",
    "raes.materialization -> raes.scenario",
    "raes.materialization -> raes.validator",
    "raes.parser -> raes.composition",
    "raes.parser -> raes.validator",
    "raes.participant_behavior_specification -> raes.participant_control_context",
    "raes.participant_control_context -> raes.validator",
    "raes.semantics.participant_temporal_bindings -> raes.scenario",
    "raes_backend_protocols.capabilities -> raes_backend_protocols.backend_manifest",
    "raes_backend_protocols.capabilities -> raes_backend_protocols.capability_admission",
    "raes_cli.main -> raes_cli.entrypoint",
    "raes_conformance.conformance.modular_control_policy -> raes_conformance.conformance.modular_control",
    "raes_runtime.control_plane -> raes_runtime.control_plane_configuration",
