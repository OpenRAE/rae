name: PR Body Policy

# The bot-authored main->dev back-merge PR changes only Release Please-managed
# files and is not subject to the human PR body policy (#1266).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - implementations/python/packages/raes/_version.py

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-body-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body-guard:
    runs-on: ubuntu-24.04
    steps:
      # Load the checker from the base revision so checker changes do not
      # self-validate. The workflow remains review-protected repository code,
      # consistent with the trust model in ADR-015 and ADR-103.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Validate pull request body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/check_pr_body.py ]; then
            echo "::notice::body guard is not on the base ref yet; bootstrap PR only"
            exit 0
          fi
          python tools/check_pr_body.py
