name: PR Body Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-body-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body-guard:
    runs-on: ubuntu-24.04
    steps:
      # Load the checker from the base revision so checker changes do not
      # self-validate. The workflow remains review-protected repository code,
      # consistent with the trust model in ADR-015 and ADR-103.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Validate pull request body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validator=tools/check_pr_body.py
          base_digest=$(sha256sum "$validator" | cut -d ' ' -f 1)
          # Explicit legacy-to-requirement-aware migration. Fetch only this
          # immutable blob, never a branch path or PR-head executable. Both pins
          # are review-protected workflow policy, independent of event input.
          if [ "$base_digest" = c3be7b261802eb2359714974778933cd4b7ef92e7b69a88f6bbd68b309a9d228 ]; then
            validator="$RUNNER_TEMP/pr-body-validator.py"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/fbfd79761f531d970766d001ba750c83dbe7770b" \
              --jq .content | base64 --decode > "$validator"
            echo "94207f785993226d1784ac1340b95a2810fb9582e1411ab7180730f3b58088e1  $validator" | sha256sum --check --strict
          fi
          python -I "$validator"
