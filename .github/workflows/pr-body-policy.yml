name: PR Body Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-body-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body-guard:
    runs-on: ubuntu-24.04
    steps:
      # Load the checker from the base revision so checker changes do not
      # self-validate. The workflow remains review-protected repository code,
      # consistent with the trust model in ADR-015 and ADR-103.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Validate pull request body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validator=tools/check_pr_body.py
          base_digest=$(sha256sum "$validator" | cut -d ' ' -f 1)
          # Explicit legacy-to-requirement-aware migration. Fetch only this
          # immutable bundle, never a branch path or PR-head executable. The pins
          # are review-protected workflow policy, independent of event input.
          if [ "$base_digest" = c3be7b261802eb2359714974778933cd4b7ef92e7b69a88f6bbd68b309a9d228 ]; then
            bundle=$(mktemp -d "$RUNNER_TEMP/pr-body-policy.XXXXXX")
            mkdir "$bundle/tools"
            validator="$bundle/tools/check_pr_body.py"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/bd3aa73b2bbca623c8806c8883f08509a3c36a05" \
              --jq .content | base64 --decode > "$validator"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/2060ea8ea5bc8e3f9ee42d3707c1882f9990c052" \
              --jq .content | base64 --decode > "$bundle/tools/pr_body_issue_scope.py"
            echo "715222ca14ffa6636f62ab06bfb1b30cd5a0e76e9a303fb602e309fe987a4e41  $validator" | sha256sum --check --strict
            echo "271afe45e06d3d99a245f586ca0f797eae36de9ede7a6a6ee547d34e939af9a3  $bundle/tools/pr_body_issue_scope.py" | sha256sum --check --strict
          fi
          python -I -S "$validator"
