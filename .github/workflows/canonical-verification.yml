name: Canonical Verification

# One exact-SHA admission graph shared by protected-branch CI and release
# publication. It preserves the existing proof-bearing nox verification lanes and
# the ADR-103 coverage authority, but distributes the default-marker test suite
# across deterministic concurrent shards (#935) so a full run finishes sooner and
# SonarCloud can start as soon as the combined coverage is ready instead of after
# the whole graph. Optional and networked jobs remain in the calling CI workflow.
#
# The caller sees this reusable workflow as one atomic job, so it exposes two
# decoupled outcomes: `gate-outcome` (every required test/coverage/policy/proof
# job) and `sonar-outcome` (the quality gate). ci.yml joins each to its own stable
# branch-protection context; a failed quality gate never masks a passing test gate
# and vice versa.

on:
  workflow_call:
    inputs:
      ref:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
      base-rev:
        description: Exact comparison base SHA (falls back to the target parent)
        required: false
        default: ""
        type: string
      requirement-branch:
        description: Branch name used to resolve an optional requirement UID
        required: false
        default: ""
        type: string
      sonar-enabled:
        description: Run the SonarCloud quality gate inside this graph
        required: false
        default: false
        type: boolean
    secrets:
      sonar_token:
        description: SonarCloud token; only consumed by the internally trust-gated sonar job
        required: false
    outputs:
      gate-outcome:
        description: success only when every required test, coverage, policy, and proof job succeeded
        value: ${{ jobs.gate.outputs.outcome }}
      sonar-outcome:
        description: success, failure, or empty (skipped) result of the quality gate
        value: ${{ jobs.sonar.outputs.outcome }}

permissions:
  contents: read

env:
  # The number of concurrent default-suite shards. Keep this equal to the length
  # of the test-shard matrix below; the reducer's completeness proof fails closed
  # if they ever drift. There is no per-module shard table (#935).
  RAES_CI_SHARD_COUNT: "8"

jobs:
  generic-tool-local-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Fetch locked generic-tool inputs with the qualified client
        run: |
          mkdir .canonical-tool-inputs
          uv run --project implementations/python --frozen python -m tools.bootstrap_profile fetch-inputs \
            public-ubuntu-24.04-x86_64 .canonical-tool-inputs \
            --artifact-id conftest --artifact-id gitleaks --artifact-id osv-scanner --artifact-id vale
      - name: Fetch the locked proof archive with the qualified client
        # Ubuntu 22.04's native curl predates the qualified client floor, so the
        # proof host receives the exact reviewed archive as a verified local input.
        run: |
          uv run --project implementations/python --frozen python -m tools.bootstrap_profile fetch-inputs \
            proof-ubuntu-22.04-x86_64 .canonical-tool-inputs --artifact-id isabelle \
            --locator-ref official-isabelle-release
      - name: Fetch the locked model checker
        run: >-
          uv run --project implementations/python --frozen python -m tools.bootstrap_profile fetch-inputs
          model-check-ubuntu-26.04-x86_64 .canonical-tool-inputs --artifact-id mcrl2
      - name: Carry locked generic-tool inputs to the dependent jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-generic-tool-inputs-${{ inputs.ref }}
          path: .canonical-tool-inputs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  model-check:
    needs: generic-tool-local-inputs
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Receive locked inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-generic-tool-inputs-${{ inputs.ref }}
          path: .canonical-tool-inputs
      - name: Install model-check host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap dpkg util-linux libc6 libstdc++6 libgcc-s1
      - name: Admit the locked model checker
        run: >-
          uv run --project implementations/tooling/python --frozen --no-default-groups
          python -m tools.mcrl2_tool acquire
          --local-input .canonical-tool-inputs/archives/mcrl2/mcrl2-202607.0_x86_64.deb
      - name: Prepare the locked Python verification environment
        run: uv sync --project implementations/python --frozen --all-extras
      - name: Check the current finite model and negative controls
        env:
          PYTHONPATH: implementations/python/packages:.
          RAES_REQUIREMENT_UID: SEM-232
        run: >-
          uv run --offline --no-sync --project implementations/tooling/python --frozen --no-default-groups
          nox -f noxfile.py -s participant-crossing-machine-check

  # Deterministic concurrent shards of the default-marker suite. Each shard owns a
  # SHA-256 partition of the collected node ids, runs xdist within its shard, and
  # emits a combinable coverage data file plus an ownership manifest. Shards are
  # credential-free and need no locked tool inputs (pure pytest).
  test-shard:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Run deterministic test shard
        env:
          # Write coverage/manifest artifacts under the runner temp dir, never the
          # checkout: a new top-level directory in the checkout would fail the
          # authority-boundary policy that the integration lane exercises.
          RAES_SHARD_COUNT: ${{ env.RAES_CI_SHARD_COUNT }}
          RAES_SHARD_INDEX: ${{ matrix.shard }}
          RAES_SHARD_SOURCE_SHA: ${{ inputs.ref }}
          RAES_VERIFY_COVERAGE_FILE: ${{ runner.temp }}/shard-out/.coverage.shard-${{ matrix.shard }}
          RAES_SHARD_MANIFEST: ${{ runner.temp }}/shard-out/shard-${{ matrix.shard }}.json
        run: |
          mkdir -p "${{ runner.temp }}/shard-out"
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-shard
      - name: Upload shard coverage data and ownership manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}-${{ inputs.ref }}
          path: |
            ${{ runner.temp }}/shard-out/.coverage.shard-${{ matrix.shard }}
            ${{ runner.temp }}/shard-out/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # Integration-marker suite with disposable self-hosted ledger and engine
  # fixtures. Its coverage joins the shards before the line floor and Sonar
  # gates, including the native service paths rather than skipping them.
  # Integration-marked policy tests exercise installed generic tools, so this
  # lane installs them from the same-run locked inputs.
  integration:
    needs: generic-tool-local-inputs
    runs-on: ubuntu-24.04
    services:
      ledger:
        # Disposable fixture credentials; no production data or identities.
        image: docker.io/library/postgres@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df
        env:
          POSTGRES_DB: rae_ledger
          POSTGRES_USER: rae_ledger
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rae_ledger -d rae_ledger"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Receive locked generic-tool inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-generic-tool-inputs-${{ inputs.ref }}
          path: .canonical-tool-inputs
      - name: Install locked generic tools from local inputs
        run: >-
          uv run --project implementations/tooling/python --frozen --no-default-groups
          python -m tools.bootstrap_profile
          generic-tools --local-input-root .canonical-tool-inputs
      - name: Fetch and verify the locked Temporal test server
        run: |
          mkdir -p implementations/tooling/.cache/runtime-integration-inputs
          uv run --project implementations/tooling/python --frozen --no-default-groups python -m tools.bootstrap_profile fetch-inputs \
            public-ubuntu-24.04-x86_64 implementations/tooling/.cache/runtime-integration-inputs --artifact-id temporal-cli-runtime-test
          uv run --project implementations/tooling/python --frozen --no-default-groups python -m implementations.tooling.runtime_execution_ci \
            implementations/tooling/.cache/runtime-integration-inputs/archives/temporal-cli-runtime-test/temporal_cli_1.9.1_linux_amd64.tar.gz \
            implementations/tooling/.cache/runtime-integration-inputs/bin/temporal
      - name: Run integration lane
        env:
          RAES_EXECUTION_INTEGRATION: "1"
          RAES_TEST_PG_HOST: "127.0.0.1"
          RAES_TEMPORAL_CLI: ${{ github.workspace }}/implementations/tooling/.cache/runtime-integration-inputs/bin/temporal
          RAES_VERIFY_COVERAGE_FILE: ${{ runner.temp }}/shard-out/.coverage.integration
        run: |
          mkdir -p "${{ runner.temp }}/shard-out"
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-integration-lane
      - name: Upload integration coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration-${{ inputs.ref }}
          path: ${{ runner.temp }}/shard-out/.coverage.integration
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # Static hygiene, repository policy (requirement-aware, base-diff), lint,
  # governed contract graph, and deterministic docs. These lanes produce no
  # coverage; they run in parallel with the shards.
  checks:
    needs: generic-tool-local-inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Bind verification to the exact commit and resolve policy base
        id: commit
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
          REQUESTED_BASE_SHA: ${{ inputs.base-rev }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "${EXPECTED_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Canonical verification requires a full lowercase commit SHA, got '${EXPECTED_SHA}'" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Checkout mismatch: expected ${EXPECTED_SHA}, got ${actual_sha}" >&2
            exit 1
          fi
          base_sha="${REQUESTED_BASE_SHA}"
          if ! printf '%s\n' "${base_sha}" | grep -Eq '^[0-9a-f]{40}$' \
            || [ "${base_sha}" = "0000000000000000000000000000000000000000" ] \
            || [ "${base_sha}" = "${EXPECTED_SHA}" ] \
            || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            if ! base_sha="$(git rev-parse "${EXPECTED_SHA}^")"; then
              echo "Cannot resolve a policy base for root commit ${EXPECTED_SHA}" >&2
              exit 1
            fi
          fi
          echo "Verified exact commit ${EXPECTED_SHA}; policy base ${base_sha}"
          echo "base_rev=${base_sha}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Receive locked generic-tool inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-generic-tool-inputs-${{ inputs.ref }}
          path: .canonical-tool-inputs
      - name: Install locked generic tools from local inputs
        run: >-
          uv run --project implementations/tooling/python --frozen --no-default-groups
          python -m tools.bootstrap_profile
          generic-tools --local-input-root .canonical-tool-inputs
      - name: Resolve requirement UID from branch
        id: requirement
        env:
          BRANCH: ${{ inputs.requirement-branch }}
        run: |
          REQ_UID="$(uv run --project implementations/tooling/python --frozen --no-default-groups python -m tools.requirement_context --branch "${BRANCH}")"
          echo "uid=${REQ_UID}" >> "${GITHUB_OUTPUT}"
      - name: Run static, policy, and lint lanes
        env:
          RAES_REQUIREMENT_UID: ${{ steps.requirement.outputs.uid }}
          RAES_REQUIREMENT_BRANCH: ${{ inputs.requirement-branch }}
          GC_BASE_URL: ${{ vars.GC_BASE_URL }}
        run: |
          verify_args=(--include-policy --base-rev "${{ steps.commit.outputs.base_rev }}")
          if [ -n "${{ steps.requirement.outputs.uid }}" ]; then
            verify_args+=(--requirement-uid "${{ steps.requirement.outputs.uid }}")
          else
            verify_args+=(--skip-requirement)
          fi
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-static-lane -- "${verify_args[@]}"
      - name: Run governed contract graph
        env:
          RAES_REQUIREMENT_UID: ${{ steps.requirement.outputs.uid }}
        run: |
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s contracts -- --base-rev "${{ steps.commit.outputs.base_rev }}"
      - name: Run deterministic documentation checks
        run: |
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s docs-local

  # The proof-bearing lane stays on Ubuntu 22.04 so Bubblewrap enforces the
  # sandbox without disabling a host security control on the runner.
  proof:
    needs: generic-tool-local-inputs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Receive locked generic-tool inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-generic-tool-inputs-${{ inputs.ref }}
          path: .canonical-tool-inputs
      - name: Install locked generic tools from local inputs
        run: >-
          uv run --project implementations/tooling/python --frozen --no-default-groups
          python -m tools.bootstrap_profile
          generic-tools --local-input-root .canonical-tool-inputs
      - name: Install proof sandbox
        run: |
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v fc-list >/dev/null 2>&1 || [ -z "$(fc-list --format='%{file}\n' | head -n 1)" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap fontconfig fonts-dejavu-core
          fi
          test -d /etc/fonts
          test -d /usr/share/fonts
          test -n "$(fc-list --format='%{file}\n' | head -n 1)"
      - name: Admit the carried Isabelle archive with egress denied
        run: >-
          bwrap --dev-bind / / --unshare-net --die-with-parent
          implementations/tooling/python/.venv/bin/python -m tools.isabelle_tool acquire
          --local-input .canonical-tool-inputs/archives/isabelle/Isabelle2025-2_linux.tar.gz
      - name: Replay the pinned participant-opacity proof
        run: |
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s participant-opacity-proof
      - name: Qualify proof-input installation slices
        run: >-
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py
          -s proof-input-qualification -- --real-installation --output proof-input-qualification.json
      - name: Retain proof-input installation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-input-${{ inputs.ref }}
          path: proof-input-qualification.json
          if-no-files-found: error

  # Prove the shards form a complete, disjoint partition of a fresh collection,
  # then combine shard + integration coverage once and enforce the 90% floor. Runs
  # only when both coverage producers succeed, so partial coverage is never
  # reported.
  coverage-reduce:
    needs: [test-shard, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Receive shard coverage data and manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*-${{ inputs.ref }}
          path: ${{ runner.temp }}/reduce
          merge-multiple: true
      - name: Receive integration coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-integration-${{ inputs.ref }}
          path: ${{ runner.temp }}/reduce
      - name: Prove completeness and combine coverage
        env:
          # Keep the combined data outside the checkout so it never adds a
          # top-level directory the authority-boundary policy would reject.
          RAES_COVERAGE_REDUCE_DIR: ${{ runner.temp }}/reduce
          RAES_SHARD_COUNT: ${{ env.RAES_CI_SHARD_COUNT }}
          RAES_SHARD_SOURCE_SHA: ${{ inputs.ref }}
        run: |
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-coverage-reduce
      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            implementations/python/coverage.xml
            implementations/python/coverage.json
          if-no-files-found: error
          retention-days: 1

  # The Go lanes of each Go module (ADR-121): tidy and verified dependencies,
  # strict lint, the repository analyzers, race-checked tests with the coverage
  # floor, mutation testing of the lines changed since the comparison base, and
  # the regression-test check. The Go toolchain and tools come from their locks.
  go:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: tooling, path: implementations/tooling/go}
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Install the locked Go toolchain
        run: |
          kit="${RUNNER_TEMP}/go-kit"
          mkdir "${kit}"
          uv run --project implementations/tooling/python --frozen --no-default-groups python \
            -m tools.bootstrap_profile fetch-inputs public-ubuntu-24.04-x86_64 "${kit}" --artifact-id go
          uv run --project implementations/tooling/python --frozen --no-default-groups python \
            -m tools.bootstrap_profile install-go public-ubuntu-24.04-x86_64 "${kit}" --go-artifact-id go > "${kit}/go.json"
          echo "${kit}/$(jq -r .path "${kit}/go.json")/bin" >> "${GITHUB_PATH}"
      - name: Build the locked Go tools
        run: |
          go -C implementations/tooling/go build -o "${RUNNER_TEMP}/go-tools/" \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint \
            github.com/go-gremlins/gremlins/cmd/gremlins \
            ./cmd/raesvet ./cmd/regressiontest
          echo "${RUNNER_TEMP}/go-tools" >> "${GITHUB_PATH}"
      - name: Check dependencies, lint, and analyzers
        working-directory: ${{ matrix.path }}
        run: |
          go mod tidy -diff
          go mod verify
          golangci-lint run ./...
          go vet -vettool="$(command -v raesvet)" ./...
      - name: Test with the race detector and the coverage floor
        working-directory: ${{ matrix.path }}
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out ./...
          total="$(go tool cover -func=cover.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          if ! awk -v total="${total}" 'BEGIN { exit !(total >= 90) }'; then
            echo "Go statement coverage ${total}% is below the 90% floor (ADR-121)" >&2
            exit 1
          fi
      - name: Resolve the comparison base
        id: base
        env:
          REQUESTED_BASE_SHA: ${{ inputs.base-rev }}
        run: |
          base="${REQUESTED_BASE_SHA}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "merge_base=$(git merge-base "${base}" HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Test the mutations of the changed lines
        working-directory: ${{ matrix.path }}
        env:
          MERGE_BASE: ${{ steps.base.outputs.merge_base }}
          # gremlins matches the paths of git diff against mutant paths, which
          # are relative to the module. git diff must use the same base.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: diff.relative
          GIT_CONFIG_VALUE_0: "true"
        run: gremlins unleash --diff "${MERGE_BASE}" --threshold-efficacy 90 --threshold-mcover 90
      - name: Check that each new regression test fails on the base
        working-directory: ${{ matrix.path }}
        env:
          MERGE_BASE: ${{ steps.base.outputs.merge_base }}
        run: regressiontest -base "${MERGE_BASE}"
      - name: Carry the Go coverage profile to SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ matrix.name }}-${{ inputs.ref }}
          path: ${{ matrix.path }}/cover.out
          if-no-files-found: error

  # The architecture check of the Go code (ADR-122). It runs once from the
  # repository root and checks the model, the ADR-122 rule table, and the code
  # of every Go module.
  go-architecture:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Install the locked Go toolchain
        run: |
          kit="${RUNNER_TEMP}/go-kit"
          mkdir "${kit}"
          uv run --project implementations/tooling/python --frozen --no-default-groups python \
            -m tools.bootstrap_profile fetch-inputs public-ubuntu-24.04-x86_64 "${kit}" --artifact-id go
          uv run --project implementations/tooling/python --frozen --no-default-groups python \
            -m tools.bootstrap_profile install-go public-ubuntu-24.04-x86_64 "${kit}" --go-artifact-id go > "${kit}/go.json"
          echo "${kit}/$(jq -r .path "${kit}/go.json")/bin" >> "${GITHUB_PATH}"
      - name: Check the Go code against the architecture model
        run: |
          go -C implementations/tooling/go build -o "${RUNNER_TEMP}/go-tools/" ./cmd/archcheck
          "${RUNNER_TEMP}/go-tools/archcheck"

  # SonarCloud quality gate. It runs inside this graph, depending only on the
  # exact source and the combined coverage, so it starts as soon as coverage is
  # ready. Its `if:` reduces the trust context to same-repository PRs and
  # protected pushes exactly like the historical top-level job, so the token is
  # never exposed to fork or Dependabot contexts.
  sonar:
    needs: [coverage-reduce, go]
    runs-on: ubuntu-24.04
    if: >-
      inputs.sonar-enabled
      && ((github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'))
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: implementations/python/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-coverage-tooling-${{ inputs.ref }}
          path: implementations/tooling/go/
      - name: SonarCloud Scan
        id: scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
      - name: Record quality-gate outcome
        id: result
        run: echo "outcome=${{ steps.scan.outcome }}" >> "${GITHUB_OUTPUT}"

  # Fail-closed aggregate over every required job. A skipped or cancelled producer
  # is distinguished from success, so a missing shard or a skipped reducer fails
  # the gate rather than silently passing.
  gate:
    needs: [test-shard, integration, checks, proof, model-check, coverage-reduce, go, go-architecture]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      outcome: ${{ steps.aggregate.outputs.outcome }}
    steps:
      - name: Aggregate required job results
        id: aggregate
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          PROOF_RESULT: ${{ needs.proof.result }}
          MODEL_CHECK_RESULT: ${{ needs.model-check.result }}
          REDUCE_RESULT: ${{ needs.coverage-reduce.result }}
          GO_RESULT: ${{ needs.go.result }}
          GO_ARCHITECTURE_RESULT: ${{ needs.go-architecture.result }}
        run: |
          set -euo pipefail
          failed=""
          for pair in \
            "test-shard:${SHARD_RESULT}" \
            "integration:${INTEGRATION_RESULT}" \
            "checks:${CHECKS_RESULT}" \
            "proof:${PROOF_RESULT}" \
            "model-check:${MODEL_CHECK_RESULT}" \
            "coverage-reduce:${REDUCE_RESULT}" \
            "go:${GO_RESULT}" \
            "go-architecture:${GO_ARCHITECTURE_RESULT}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "${result}" != "success" ]; then
              echo "required job ${name} concluded with '${result}'" >&2
              failed="${failed} ${name}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "outcome=failure" >> "${GITHUB_OUTPUT}"
            echo "canonical gate failed:${failed}" >&2
            exit 1
          fi
          echo "outcome=success" >> "${GITHUB_OUTPUT}"
