name: Python free-threaded preview

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-314t:
    name: CPython 3.14t preview only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      UV_PYTHON: 3.14.7t
      RAES_EXPECTED_PYTHON: "3.14"
      RAES_EXPECT_FREE_THREADED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.7t
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v8
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Test preview interpreter and clean distribution
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s python-compatibility
