name: Python free-threaded preview

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-314t:
    name: CPython 3.14t preview only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      UV_PYTHON: 3.14.7t
      RAES_EXPECTED_PYTHON: "3.14"
      RAES_EXPECT_FREE_THREADED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7t
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8
        with:
          enable-cache: false
          version: "0.12.4"
      - name: Test preview interpreter and clean distribution
        run: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s python-compatibility
