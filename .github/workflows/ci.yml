name: CI

# Release Please bookkeeping (the release PR, the main->dev back-merge PR, and
# their merge pushes) changes only the release-managed files below. Every check
# already ran on the dev->main promotion, and release-please.yml re-runs the
# canonical verifier on the exact release SHA before publishing, so those events
# do not trigger this workflow. The list is kept identical across workflows and
# equal to the files Release Please manages (#1266).
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - implementations/python/packages/raes/_version.py
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - implementations/python/packages/raes/_version.py
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  canonical:
    permissions:
      contents: read
    uses: ./.github/workflows/canonical-verification.yml
    with:
      ref: ${{ github.sha }}
      base-rev: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      requirement-branch: ${{ github.head_ref || github.ref_name }}

  # The repository's dev/main branch protections require the historical
  # `verify` check context. Reusable jobs report nested contexts, so preserve
  # that stable contract with a same-run result join. The reusable call owns the
  # existing proof-bearing nox graph; this join cannot turn any failed or
  # skipped admission job into success.
  verify:
    needs: canonical
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Preserve the required canonical verification status
        env:
          CANONICAL_RESULT: ${{ needs.canonical.result }}
        run: |
          if [ "${CANONICAL_RESULT}" != "success" ]; then
            echo "Canonical verification concluded with '${CANONICAL_RESULT}'" >&2
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8
        with:
          enable-cache: false
          version: "0.12.4"
      - name: Run fuzz session
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s fuzz

  interpreters:
    name: CPython ${{ matrix.python.feature }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python:
          - {feature: "3.11", payload: "3.11.16", closure: public-linux-x86_64-cp311-all-extras}
          - {feature: "3.12", payload: "3.12.14", closure: public-linux-x86_64-cp312-all-extras}
          - {feature: "3.13", payload: "3.13.15", closure: public-linux-x86_64-cp313-all-extras}
          - {feature: "3.14", payload: "3.14.7", closure: public-linux-x86_64-cp314-all-extras}
    env:
      UV_PYTHON: ${{ matrix.python.payload }}
      RAES_EXPECTED_PYTHON: ${{ matrix.python.feature }}
      RAES_PYTHON_CLOSURE_PROFILE: ${{ matrix.python.closure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python.payload }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8
        with:
          enable-cache: false
          version: "0.12.4"
      - name: Test exact interpreter and clean distribution
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s python-compatibility
      - name: Record exact interpreter qualification
        run: |
          uv run --project implementations/python --frozen python -m tools.bootstrap_profile record-case T03 \
            "${{ github.sha }}" noxfile.py --artifact-id "cpython-${{ matrix.python.feature }}" --artifact-id uv \
            > t03-result.json
          uv run --project implementations/python --frozen python -m tools.bootstrap_profile qualification-evidence \
            public-ubuntu-24.04-x86_64 "${{ github.sha }}" \
            "github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}" \
            --python-artifact-id "cpython-${{ matrix.python.feature }}" --case-result t03-result.json \
            > python-qualification.json
      - name: Upload interpreter qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python.feature }}-${{ github.sha }}
          path: python-qualification.json
          if-no-files-found: error

  # Opt-in, non-blocking, runtime-gated container integration tests (RUN-314).
  # Kept out of the hermetic `verify` graph; the `docker` marker tests self-skip
  # when no runtime is present, and this whole job never fails the build.
  integration-docker:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8
        with:
          enable-cache: false
          version: "0.12.4"
      - name: Probe for a container runtime
        id: runtime
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No container runtime available; skipping docker integration session."
          fi
      - name: Run docker integration session
        if: steps.runtime.outputs.available == 'true'
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s integration_docker

  # Gating OSV-scanner sweep over the Python dependency lockfile (issue #1098).
  # Kept out of the hermetic `verify` graph because the scanner is networked.
  # Findings and scanner/setup errors both fail, with distinct diagnostics; the
  # report upload remains unconditional so either failure is reviewable.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8
        with:
          enable-cache: false
          version: "0.12.4"
      - name: Run OSV-scanner (gating)
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s osv_scan
      - name: Upload OSV-scanner report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-report
          path: implementations/python/osv-scanner-report.json
          if-no-files-found: warn

  sonar:
    runs-on: ubuntu-24.04
    needs: [verify]
    # GitHub withholds Actions secrets from forked and Dependabot pull requests.
    # Run the quality gate for same-repository PRs so findings block the
    # merge, while keeping the credential out of untrusted contribution paths.
    if: >-
      (github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: implementations/python/
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
