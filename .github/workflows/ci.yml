name: CI

# Release Please bookkeeping (the release PR, the main->dev back-merge PR, and
# their merge pushes) changes only the release-managed files below. Every check
# already ran on the dev->main promotion, and release-please.yml re-runs the
# canonical verifier on the exact release SHA before publishing, so those events
# do not trigger this workflow. The list is kept identical across workflows and
# equal to the files Release Please manages (#1266).
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - implementations/python/packages/raes/_version.py
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - implementations/python/packages/raes/_version.py
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  canonical:
    permissions:
      contents: read
    uses: ./.github/workflows/canonical-verification.yml
    with:
      ref: ${{ github.sha }}
      base-rev: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      requirement-branch: ${{ github.head_ref || github.ref_name }}
      # Run the quality gate inside the reusable graph. The reusable sonar job is
      # itself trust-gated to same-repository PRs and protected pushes, so the
      # token below is never exposed to fork or Dependabot contexts.
      sonar-enabled: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # The repository's dev/main branch protections require the historical `verify`
  # and `sonar` check contexts. The reusable call is atomic to this caller, so it
  # exposes two decoupled outcomes; each join below preserves one stable context
  # and cannot turn a failed or skipped reusable job into success. A red quality
  # gate no longer blocks the `verify` context and vice versa (#935).
  verify:
    needs: [canonical, runtime-supervision]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Preserve the required canonical verification status
        env:
          GATE_OUTCOME: ${{ needs.canonical.outputs.gate-outcome }}
          EXECUTION_OUTCOME: ${{ needs.runtime-supervision.result }}
        run: |
          if [ "${GATE_OUTCOME}" != "success" ]; then
            echo "Canonical verification gate concluded with '${GATE_OUTCOME}'" >&2
            exit 1
          fi
          if [ "${EXECUTION_OUTCOME}" != "success" ]; then
            echo "Runtime execution integration did not pass" >&2
            exit 1
          fi

  runtime-supervision:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      ledger:
        # Disposable fixture credentials; no production data or identities.
        image: docker.io/library/postgres@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df
        env:
          POSTGRES_DB: rae_ledger
          POSTGRES_USER: rae_ledger
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rae_ledger -d rae_ledger"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v8
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Fetch and verify the locked Temporal test server
        run: |
          mkdir -p implementations/tooling/.cache/runtime-integration-inputs
          uv run --project implementations/tooling/python --frozen --no-default-groups python -m tools.bootstrap_profile fetch-inputs \
            public-ubuntu-24.04-x86_64 implementations/tooling/.cache/runtime-integration-inputs --artifact-id temporal-cli-runtime-test
          uv run --project implementations/tooling/python --frozen --no-default-groups python -m implementations.tooling.runtime_execution_ci \
            implementations/tooling/.cache/runtime-integration-inputs/archives/temporal-cli-runtime-test/temporal_cli_1.9.1_linux_amd64.tar.gz \
            implementations/tooling/.cache/runtime-integration-inputs/bin/temporal
      - name: Exercise actual delivery and ledger transactions
        env:
          RAES_EXECUTION_INTEGRATION: "1"
          RAES_TEST_PG_HOST: "127.0.0.1"
          RAES_TEMPORAL_CLI: implementations/tooling/.cache/runtime-integration-inputs/bin/temporal
        run: >-
          uv run --project implementations/python --frozen --extra dev --extra distributed pytest -q
          implementations/python/tests/test_issue_1362_distributed_integration.py -m integration --no-cov

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v8
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Run fuzz session
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s fuzz

  interpreters:
    name: CPython ${{ matrix.python.feature }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python:
          - {feature: "3.11", payload: "3.11.16", closure: public-linux-x86_64-cp311-all-extras}
          - {feature: "3.12", payload: "3.12.14", closure: public-linux-x86_64-cp312-all-extras}
          - {feature: "3.13", payload: "3.13.15", closure: public-linux-x86_64-cp313-all-extras}
          - {feature: "3.14", payload: "3.14.7", closure: public-linux-x86_64-cp314-all-extras}
    env:
      UV_PYTHON: ${{ matrix.python.payload }}
      RAES_EXPECTED_PYTHON: ${{ matrix.python.feature }}
      RAES_PYTHON_CLOSURE_PROFILE: ${{ matrix.python.closure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python.payload }}
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v8
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Test exact interpreter and clean distribution
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s python-compatibility

  # Gating OSV-scanner sweep over the Python dependency lockfile (issue #1098).
  # Kept out of the hermetic `verify` graph because the scanner is networked.
  # Findings and scanner/setup errors both fail, with distinct diagnostics; the
  # report upload remains unconditional so either failure is reviewable.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v8
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Run OSV-scanner (gating)
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s osv_scan
      - name: Upload OSV-scanner report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-report
          path: implementations/python/osv-scanner-report.json
          if-no-files-found: warn

  # The quality gate now runs inside the reusable graph (decoupled from the full
  # test gate). This join preserves the required `sonar` context by checking the
  # reusable quality-gate outcome. When Sonar is required for this event
  # (same-repository PR or protected push) the outcome MUST be success: an empty
  # outcome then means the scan failed before recording a verdict (e.g. checkout
  # or artifact download), which must fail closed rather than pass as "skipped".
  # An empty outcome is only allowed for the trust contexts where Sonar is
  # intentionally not run (fork or Dependabot pull request).
  sonar:
    needs: canonical
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Preserve the required SonarCloud quality-gate status
        env:
          SONAR_OUTCOME: ${{ needs.canonical.outputs.sonar-outcome }}
          SONAR_REQUIRED: >-
            ${{ (github.event_name == 'push'
            && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
            || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.actor != 'dependabot[bot]') }}
        run: |
          if [ "${SONAR_REQUIRED}" = "true" ]; then
            if [ "${SONAR_OUTCOME}" != "success" ]; then
              echo "SonarCloud quality gate was required but concluded with '${SONAR_OUTCOME:-<no verdict>}'" >&2
              exit 1
            fi
          elif [ -n "${SONAR_OUTCOME}" ] && [ "${SONAR_OUTCOME}" != "success" ]; then
            echo "SonarCloud quality gate concluded with '${SONAR_OUTCOME}'" >&2
            exit 1
          fi

  # Advisory early-feedback lane (#935): static/lint/policy for the diff plus any
  # directly changed pytest modules, using the fail-closed change selector. It is
  # NOT a required check and never a merge gate; the full-suite shards inside the
  # canonical graph remain authoritative.
  fast-feedback:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v8
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Fetch locked generic-tool inputs with the qualified client
        run: |
          mkdir .canonical-tool-inputs
          uv run --project implementations/python --frozen python -m tools.bootstrap_profile fetch-inputs \
            public-ubuntu-24.04-x86_64 .canonical-tool-inputs \
            --artifact-id conftest --artifact-id gitleaks --artifact-id osv-scanner --artifact-id vale
      - name: Install locked generic tools from local inputs
        run: >-
          uv run --project implementations/tooling/python --frozen --no-default-groups
          python -m tools.bootstrap_profile
          generic-tools --local-input-root .canonical-tool-inputs
      - name: Resolve policy base and requirement UID
        id: context
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "base_rev=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          REQ_UID="$(uv run --project implementations/tooling/python --frozen --no-default-groups python -m tools.requirement_context --branch "${BRANCH}")"
          echo "uid=${REQ_UID}" >> "${GITHUB_OUTPUT}"
      - name: Run advisory fast-feedback lane
        env:
          RAES_REQUIREMENT_UID: ${{ steps.context.outputs.uid }}
          RAES_REQUIREMENT_BRANCH: ${{ github.head_ref }}
          GC_BASE_URL: ${{ vars.GC_BASE_URL }}
        run: |
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-fast-feedback -- --base-rev "${{ steps.context.outputs.base_rev }}"
