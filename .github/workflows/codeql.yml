name: CodeQL

# Code scanning default setup is off. This workflow reports the CodeQL contexts
# that the main, dev and go-cutover rulesets require. Each branch contains the
# release helper's CJS source, so each branch scans all three languages.
on:
  push:
    branches: [main, dev, go-cutover]
  pull_request:
    branches: [main, dev, go-cutover]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: ${{ vars.CODEQL_ADVANCED_ENABLED != 'true' && 'Staged ' || '' }}Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    if: vars.CODEQL_ADVANCED_ENABLED == 'true'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
