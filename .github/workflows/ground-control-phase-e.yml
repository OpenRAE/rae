name: Ground Control Phase E
# Carries the pull request into the run record, so a dispatch run — which has no
# `pull_requests` association — is still bound to what it finalized (issue #1671).
run-name: Ground Control Phase E for PR ${{ github.event.pull_request.number || inputs.pr }}

# A merged Ground Control delivery pull request finishes Phase E here, with no model or
# agent session. The agent records a trusted delivery-readiness handoff at Phase D and may
# then terminate permanently; this job is a trigger and a transport.
#
# It holds no `gh` logic, no marker parser, and no completion reconstruction. It passes the
# event's pull-request number to `grndctl finalize-merged-pr`, which resolves the issue from
# the trusted pointer and replays the recorded payload through the incumbent finalizer — so
# the merge gate, the immutable merged-revision requirement verification, the final-report
# marker, and the idempotent close all still apply, unchanged.
#
# It runs no tests, no policy suite, and no review, and it waits for no other post-merge job.
#
# grndctl comes from a pinned Ground Control release, checked by digest. npm has no release
# after 1.2.1. Change the release, the tag commit and both digests together.

on:
  pull_request:
    types: [closed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to finalize (maintainer repair path)
        required: true
        type: string

concurrency:
  # Serialize per pull request so a replay cannot race itself. Never cancel: a cancelled
  # finalization leaves neither a final report nor a failure record.
  group: gc-phase-e-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  # The close gate verifies this job's own run through the Actions API before it accepts an
  # automation-authored final-report marker.
  actions: read
  issues: read

jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The read token downloads the private Ground Control release asset and the lockfile at
      # the tag commit. This step runs before any checkout, so no repository file is present
      # while the token is. Only this step receives the token.
      - name: Download grndctl
        env:
          GH_TOKEN: ${{ secrets.GROUND_CONTROL_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Set GROUND_CONTROL_READ_TOKEN with read access to the Ground Control releases.' >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/grndctl"
          cd "$RUNNER_TEMP/grndctl"
          gh release download v1.12.0 --repo autarchy-ai/Ground-Control --pattern grndctl-1.12.0.tgz
          gh api -H 'Accept: application/vnd.github.raw+json' \
            'repos/autarchy-ai/Ground-Control/contents/mcp/ground-control/package-lock.json?ref=4b0bb6eea0082bda66c5e610495eb4bb59937467' \
            > package-lock.json
      # Both digests are checked before extraction. npm runs in the extracted release, outside
      # the checkout, and runs no lifecycle scripts.
      - name: Verify and install grndctl
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/grndctl"
          printf '%s  %s\n' \
            67ab2945bd35ef107b2d4c4cbd60d1f66307e57199615bfdabf7f5c6dcbb31e5 grndctl-1.12.0.tgz \
            664227a394b6b196b4b692db0ae8eee2134d0b735628230c11f5ab0b2646145e package-lock.json \
            | sha256sum --check --strict
          tar -xzf grndctl-1.12.0.tgz
          mv package-lock.json package/
          cd package
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      # The immutable merge revision, never the pull-request head. Phase E reads requirement
      # state from the merged tree and executes none of the delivered code; `fetch-depth: 0`
      # brings every branch, so the merge commit is present on the dispatch path too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Finalize the merged delivery
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: node "$RUNNER_TEMP/grndctl/package/bin/grndctl.js" finalize-merged-pr --pr "$PR"
