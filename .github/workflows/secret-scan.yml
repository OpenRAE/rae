name: Secret Scan

# The GitGuardian App posts its check on pull request commits only. It does not
# report on a merge group commit, so the `dev` merge queue cannot use it as a
# required context (#2026). This job runs ggshield on both events and produces
# the required `GitGuardian Security Checks` context. The App stays installed.
#
# The job runs no repository code. It checks out the commits and scans them with
# a digest-pinned ggshield image. ggshield reads only its default configuration,
# so a change cannot relax its own scan through a repository `.gitguardian.yaml`
# file. A missing API key fails the job.
on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - implementations/python/packages/raes/_version.py
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ggshield:
    name: GitGuardian Security Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # `--config-path /dev/null` loads the default configuration and makes
      # ggshield ignore the repository and user configuration files. The runner
      # splits `args` on spaces and does not honor shell quotes, so the step
      # passes plain arguments to ggshield and runs no shell.
      - name: Scan the commits of the change for secrets
        uses: docker://gitguardian/ggshield@sha256:16be3720bb9ef6fc7b4768d6b8c546cf836c8e9fa19a1012556bbaf8af5c4983 # v1.56.1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          # The runner owns the checkout and the container runs as root.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: >-
            ggshield --config-path /dev/null secret scan commit-range
            ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}..${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
