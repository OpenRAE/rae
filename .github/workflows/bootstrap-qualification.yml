name: Bootstrap qualification

# Qualify changed tooling components, not unrelated application or documentation edits.
on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/bootstrap-qualification.yml'
      - '.devcontainer/**'
      - 'implementations/tooling/**'
      - 'implementations/python/pyproject.toml'
      - 'implementations/python/uv.lock'
      - 'implementations/python/tests/test_issue_1217_bootstrap_profiles.py'
      - 'implementations/python/tests/test_issue_1219_verified_tool_installation.py'
      - 'implementations/python/tests/test_issue_1220_isabelle_acquisition.py'
      - 'implementations/python/tests/test_issue_1238_development_container.py'
      - 'implementations/python/tests/test_issue_1313_workflow_policy.py'
      - 'tools/**'
      - 'noxfile.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-tool-platforms:
    name: ${{ matrix.profile }} T02/T08 (arm64 T12)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: public-ubuntu-24.04-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, project_closure: public-linux-x86_64-cp314-all-extras}
          - {profile: public-linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, project_closure: public-linux-arm64-cp314-all-extras}
          - {profile: public-macos-arm64, runner: macos-15, target: aarch64-apple-darwin, project_closure: public-macos-arm64-cp314-all-extras}
    env:
      UV_PYTHON: "3.14.7"
      UV_PYTHON_PLATFORM: ${{ matrix.target }}
      RAES_EXPECTED_PYTHON: "3.14"
      RAES_PYTHON_CLOSURE_PROFILE: ${{ matrix.project_closure }}
      RAES_PYTHON_COMPATIBILITY_SMOKE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install exact uv payload
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v8
        with:
          version: "0.12.4"
          enable-cache: false
      - name: Install frozen qualification environment
        run: uv sync --project implementations/tooling/python --frozen --no-default-groups
      - name: Validate reviewed bootstrap policy
        env:
          RAES_REQUIREMENT_UID: GOV-913
        run: uv run --project implementations/tooling/python --frozen --no-default-groups python tools/check_tooling_artifact_policy.py
      - name: Exercise supported Python wheel and ABI closure
        if: matrix.project_closure != ''
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s python-compatibility
      - name: Exercise verified tool acquisition and reuse
        run: |
          uv run --project implementations/tooling/python --frozen --no-default-groups python \
            -m tools.bootstrap_profile generic-tools
      - name: Exercise maintained curl behavior
        run: |
          uv run --project implementations/tooling/python --frozen --no-default-groups --group acquisition-tests python \
            -m pytest -q implementations/python/tests/test_issue_1217_bootstrap_profiles.py \
            implementations/python/tests/test_issue_1220_isabelle_acquisition.py -m integration -k real_curl
      - name: Exercise verified local installation behavior
        run: >-
          uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py
          -s local-installation-qualification -- --output local-installation-qualification.json
      - name: Retain local installation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-${{ matrix.profile }}-${{ github.sha }}
          path: local-installation-qualification.json
          if-no-files-found: error

  development-image:
    name: container-ubuntu-24.04-x86_64 dev-container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RAES_REQUIREMENT_UID: GOV-913
      UV_PYTHON: "3.14.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install exact uv payload
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v8
        with:
          version: "0.12.4"
          enable-cache: false
      - name: Validate the image definition before building
        env:
          HOST_PROFILE_ID: container-ubuntu-24.04-x86_64
        run: |
          tool_python=(uv run --project implementations/tooling/python --frozen --no-default-groups python)
          uv sync --project implementations/tooling/python --frozen --no-default-groups
          "${tool_python[@]}" tools/check_tooling_artifact_policy.py
          plan="${RUNNER_TEMP}/development-image-plan.json"
          "${tool_python[@]}" -m tools.devcontainer_image --host-profile-id "${HOST_PROFILE_ID}" > "${plan}"
          # The locked platform manifest must be the one the reviewed base index publishes for this platform.
          architecture="$(jq -r '.oci_platform | split("/")[1]' "${plan}")"
          resolved="$(docker buildx imagetools inspect --raw \
            "$(jq -r '.base_image_reference | split("@")[0]' "${plan}")@$(jq -r .base_image_index_digest "${plan}")" \
            | jq -r --arg architecture "${architecture}" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest')"
          test "${resolved}" = "$(jq -r .base_image_digest "${plan}")"
      - name: Build this platform from an empty builder cache
        id: image
        run: |
          plan="${RUNNER_TEMP}/development-image-plan.json"
          docker buildx create --name raes-clean-builder --driver docker-container
          docker buildx build --builder raes-clean-builder --no-cache --pull \
            --load --tag raes-development-image:smoke --file .devcontainer/Dockerfile .devcontainer
          echo "image_id=$(docker image inspect raes-development-image:smoke --format '{{.Id}}')" >> "${GITHUB_OUTPUT}"
      - name: Prepare a clean checkout owned by the development user
        run: |
          git clone --no-local --no-hardlinks "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/rae"
          development_uid="$(docker run --rm --entrypoint id raes-development-image:smoke -u)"
          development_gid="$(docker run --rm --entrypoint id raes-development-image:smoke -g)"
          sudo chown -R "${development_uid}:${development_gid}" "${RUNNER_TEMP}/rae"
      - name: Open the container as a dev-container client does
        run: |
          workspace=/workspaces/rae
          image_path="$(docker image inspect raes-development-image:smoke \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^PATH=//p')"
          remote_path="$(jq -r .remoteEnv.PATH .devcontainer/devcontainer.json)"
          remote_path="${remote_path//'${containerWorkspaceFolder}'/${workspace}}"
          remote_path="${remote_path//'${containerEnv:PATH}'/${image_path}}"
          setup_command="$(jq -r .updateContentCommand .devcontainer/devcontainer.json)"
          {
            echo "DEVCONTAINER_WORKSPACE=${workspace}"
            echo "DEVCONTAINER_REMOTE_PATH=${remote_path}"
          } >> "${GITHUB_ENV}"
          for attempt in first repeated; do
            echo "::group::${attempt} lifecycle setup"
            docker run --rm --volume "${RUNNER_TEMP}/rae:${workspace}" --volume raes-development-cache:/home/raes/.cache \
              --workdir "${workspace}" --env PATH="${remote_path}" raes-development-image:smoke bash -c "${setup_command}"
            echo "::endgroup::"
          done
      - name: Work in a new terminal as a maintainer would
        run: |
          docker run --rm --volume "${RUNNER_TEMP}/rae:${DEVCONTAINER_WORKSPACE}" \
            --volume raes-development-cache:/home/raes/.cache --workdir "${DEVCONTAINER_WORKSPACE}" \
            --env PATH="${DEVCONTAINER_REMOTE_PATH}" raes-development-image:smoke bash -euo pipefail -c '
              test "$(id -u)" -ne 0
              for tool in uv python nox pre-commit ruff gh git ssh gpg make jq less nano; do
                command -v "${tool}"
              done
              test -x .git/hooks/pre-commit
              test ! -e .git/hooks/pre-push
              nox -s policy -- --skip-requirement
              nox -s lint
              nox -s tests
            '
      - name: Confirm proof and container-daemon capabilities are refused, not implied
        run: |
          docker run --rm --volume "${RUNNER_TEMP}/rae:${DEVCONTAINER_WORKSPACE}" \
            --volume raes-development-cache:/home/raes/.cache --workdir "${DEVCONTAINER_WORKSPACE}" \
            --env PATH="${DEVCONTAINER_REMOTE_PATH}" raes-development-image:smoke bash -euo pipefail -c '
              for absent in bwrap docker podman isabelle; do
                if command -v "${absent}" >/dev/null; then
                  echo "development image must not supply ${absent}" >&2
                  exit 1
                fi
              done
              test ! -e /var/run/docker.sock
              if nox -s participant-opacity-proof > /tmp/proof.log 2>&1; then
                echo "unsupported proof execution must fail" >&2
                exit 1
              fi
              grep -Fx "participant-opacity-proof: bubblewrap is required to enforce offline proof replay" /tmp/proof.log
            '
      - name: Record bounded clean-image evidence
        env:
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          jq -S \
            --arg source_revision "${GITHUB_SHA}" \
            --arg image_id "${IMAGE_ID}" \
            --arg lock_sha256 "$(sha256sum implementations/tooling/artifacts.lock.json | cut -d ' ' -f 1)" \
            --arg profiles_sha256 "$(sha256sum implementations/tooling/profiles/development-profiles.json | cut -d ' ' -f 1)" \
            '{
              host_profile_id,
              platform_id,
              oci_platform,
              source_revision: $source_revision,
              declared_base_image_index_digest: .base_image_index_digest,
              declared_base_image_digest: .base_image_digest,
              resulting_image_id: $image_id,
              artifact_lock_sha256: $lock_sha256,
              development_profiles_sha256: $profiles_sha256,
              commands: [
                "tools/check_tooling_artifact_policy.py",
                "docker buildx imagetools inspect --raw <base index> (locked platform manifest matches the index)",
                "docker buildx build --no-cache --pull (Dockerfile pins the platform)",
                "devcontainer.json updateContentCommand with remoteEnv PATH (first and repeated)",
                "nox -s policy -- --skip-requirement",
                "nox -s lint",
                "nox -s tests",
                "nox -s participant-opacity-proof (expected capability refusal)"
              ],
              outcome: "passed"
            }' \
            "${RUNNER_TEMP}/development-image-plan.json" > development-image-qualification.json
      - name: Retain bounded clean-image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-image-${{ github.sha }}
          path: development-image-qualification.json
          if-no-files-found: error
