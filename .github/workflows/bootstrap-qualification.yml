name: Bootstrap qualification

# The main->dev back-merge PR changes only Release Please-managed files, which
# were qualified on the dev->main promotion; it does not trigger this (#1266).
on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - implementations/python/packages/raes/_version.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-tool-platforms:
    name: ${{ matrix.profile }} T02/T08 (arm64 T12)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: public-ubuntu-24.04-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, tool_closure: public-linux-x86_64-cp314-tools, tool_requirements: implementations/tooling/python/smoke/tools-linux-x86_64-cp314.txt, project_closure: public-linux-x86_64-cp314-all-extras}
          - {profile: public-linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, tool_closure: public-linux-arm64-cp314-tools, tool_requirements: implementations/tooling/python/smoke/tools-linux-arm64-cp314.txt, project_closure: public-linux-arm64-cp314-all-extras}
          - {profile: public-macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, tool_closure: public-macos-x86_64-cp314-tools, tool_requirements: implementations/tooling/python/smoke/tools-macos-x86_64-cp314.txt, project_closure: ""}
          - {profile: public-macos-arm64, runner: macos-15, target: aarch64-apple-darwin, tool_closure: public-macos-arm64-cp314-tools, tool_requirements: implementations/tooling/python/smoke/tools-macos-arm64-cp314.txt, project_closure: public-macos-arm64-cp314-all-extras}
    env:
      UV_PYTHON: "3.14.7"
      UV_PYTHON_PLATFORM: ${{ matrix.target }}
      RAES_EXPECTED_PYTHON: "3.14"
      RAES_PYTHON_CLOSURE_PROFILE: ${{ matrix.project_closure }}
      RAES_PYTHON_COMPATIBILITY_SMOKE_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install exact uv payload
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8
        with:
          version: "0.12.4"
          enable-cache: false
      - name: Install frozen qualification environment
        run: uv sync --project implementations/tooling/python --frozen --no-default-groups
      - name: Validate reviewed bootstrap policy
        env:
          RAES_REQUIREMENT_UID: GOV-913
        run: uv run --project implementations/tooling/python --frozen --no-default-groups python tools/check_tooling_artifact_policy.py
      - name: Exercise supported Python wheel and ABI closure
        if: matrix.project_closure != ''
        run: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s python-compatibility
      - name: Build the credential-free target payload kit
        id: kit
        run: |
          tool_python=(uv run --project implementations/tooling/python --frozen --no-default-groups python)
          "${tool_python[@]}" -m tools.bootstrap_profile generic-tools
          mkdir -p .qualification-kit/bin .qualification-kit/python .qualification-kit/.cache/raes-sdl \
            .qualification-kit/tool-wheelhouse
          "${tool_python[@]}" -m tools.bootstrap_profile offline-kit-fetch \
            "${{ matrix.profile }}" .qualification-kit --artifact-id cpython-3.14 --artifact-id uv \
            --artifact-id conftest --artifact-id gitleaks --artifact-id osv-scanner --artifact-id vale
          cp "$(command -v uv)" .qualification-kit/bin/uv
          "${tool_python[@]}" -m tools.bootstrap_profile offline-kit-install-python \
            "${{ matrix.profile }}" .qualification-kit --python-artifact-id cpython-3.14
          "${tool_python[@]}" -m tools.python_closure materialize \
            --profile "${{ matrix.tool_closure }}" --wheelhouse .qualification-kit/tool-wheelhouse
          "${tool_python[@]}" -m tools.python_closure manifest-show \
            --profile "${{ matrix.tool_closure }}" > .qualification-kit/tool-wheelhouse-manifest.json
          if [ -n "${{ matrix.project_closure }}" ]; then
            mkdir .qualification-kit/project-wheelhouse
            "${tool_python[@]}" -m tools.python_closure materialize \
              --profile "${{ matrix.project_closure }}" --wheelhouse .qualification-kit/project-wheelhouse
            "${tool_python[@]}" -m tools.python_closure manifest-show \
              --profile "${{ matrix.project_closure }}" > .qualification-kit/wheelhouse-manifest.json
          fi
          "${tool_python[@]}" -m tools.bootstrap_profile offline-kit-copy-tree \
            .cache/raes-sdl/tooling .qualification-kit/.cache/raes-sdl/tooling
          "${tool_python[@]}" -m tools.bootstrap_profile offline-kit-manifest \
            "${{ matrix.profile }}" .qualification-kit --python-artifact-id cpython-3.14 \
            > .qualification-kit/offline-kit-manifest.json
          manifest_sha256="$("${tool_python[@]}" -m tools.bootstrap_profile \
            offline-kit-manifest-digest .qualification-kit/offline-kit-manifest.json)"
          echo "manifest_sha256=${manifest_sha256}" >> "$GITHUB_OUTPUT"
          tar -cf bootstrap-offline-kit.tar .qualification-kit
      - name: Restore and exercise the payload kit without network fallback
        run: |
          rm -rf .qualification-kit .cache/raes-sdl/tooling .qualification-restored \
            implementations/python/.venv implementations/tooling/python/.venv
          mkdir .qualification-restored
          tar -xf bootstrap-offline-kit.tar -C .qualification-restored --strip-components=1
          restored_root="${{ github.workspace }}/.qualification-restored"
          restored_python="$(find "${restored_root}/python" -path '*/bin/python3.14' -print)"
          test -n "${restored_python}"
          export UV_PYTHON="${restored_python}"
          export PATH="${restored_root}/bin:/usr/bin:/bin"
          export UV_PYTHON_INSTALL_DIR="${restored_root}/python"
          export UV_PYTHON_DOWNLOADS=never
          export UV_OFFLINE=1
          runtime_root="$(mktemp -d "${RUNNER_TEMP}/raes-bootstrap-runtime.XXXXXX")"
          export UV_CACHE_DIR="${runtime_root}/uv-cache"
          mkdir "${UV_CACHE_DIR}"
          "${restored_python}" -m tools.python_closure bootstrap-wheelhouse-verify \
            --profile "${{ matrix.tool_closure }}" --wheelhouse "${restored_root}/tool-wheelhouse" \
            --manifest-snapshot "${restored_root}/tool-wheelhouse-manifest.json"
          if [ -n "${{ matrix.project_closure }}" ]; then
            "${restored_python}" -m tools.python_closure bootstrap-wheelhouse-verify \
              --profile "${{ matrix.project_closure }}" --wheelhouse "${restored_root}/project-wheelhouse" \
              --manifest-snapshot "${restored_root}/wheelhouse-manifest.json"
          fi
          restored_tool_environment="${runtime_root}/tool-environment"
          "${restored_root}/bin/uv" venv --no-project --python "${restored_python}" \
            "${restored_tool_environment}"
          restored_tool_python="${restored_tool_environment}/bin/python"
          "${restored_root}/bin/uv" pip install --python "${restored_tool_python}" \
            --requirements "${{ matrix.tool_requirements }}" --require-hashes --only-binary :all: \
            --offline --no-index --find-links "${restored_root}/tool-wheelhouse"
          "${restored_tool_python}" -m tools.bootstrap_profile offline-kit-verify \
            "${{ matrix.profile }}" "${restored_root}" --python-artifact-id cpython-3.14 \
            --trusted-manifest-sha256 "${{ steps.kit.outputs.manifest_sha256 }}"
          if [ -n "${{ matrix.project_closure }}" ]; then
            export UV_FIND_LINKS="${restored_root}/tool-wheelhouse,${restored_root}/project-wheelhouse"
            export UV_NO_INDEX=1
            export RAES_PYTHON_CLOSURE_WHEELHOUSE="${restored_root}/project-wheelhouse"
            "${restored_tool_python}" -m nox -f noxfile.py -s python-compatibility
          else
            "${restored_tool_python}" -c \
              'import cryptography; from importlib.metadata import version; print(version("nox"))'
          fi
          "${restored_tool_python}" -m tools.bootstrap_profile record-case T02 "${{ github.sha }}" noxfile.py \
            --artifact-id cpython-3.14 --artifact-id uv --artifact-id conftest --artifact-id gitleaks \
            --artifact-id osv-scanner --artifact-id vale > t02-result.json
          if [ "${{ matrix.profile }}" = public-linux-arm64 ] || [ "${{ matrix.profile }}" = public-macos-arm64 ]; then
            "${restored_tool_python}" -m tools.bootstrap_profile record-case T12 "${{ github.sha }}" \
              tools/bootstrap_profile.py --artifact-id cpython-3.14 --artifact-id uv --artifact-id conftest \
              --artifact-id gitleaks --artifact-id osv-scanner --artifact-id vale > t12-result.json
          fi
      - name: Exercise maintained curl behavior
        run: |
          uv run --project implementations/tooling/python --frozen --no-default-groups python \
            -m tools.bootstrap_profile inspect-profile "${{ matrix.profile }}"
          uv run --project implementations/tooling/python --frozen --no-default-groups python -m pytest -q \
            implementations/python/tests/test_issue_1217_bootstrap_profiles.py -m integration -k real_curl
          uv run --project implementations/tooling/python --frozen --no-default-groups python \
            -m tools.bootstrap_profile record-case T08 "${{ github.sha }}" \
            implementations/python/tests/test_issue_1217_bootstrap_profiles.py > t08-result.json
      - name: Record exact measured profile evidence
        run: |
          mkdir .qualification-evidence-root
          tar -xf bootstrap-offline-kit.tar -C .qualification-evidence-root --strip-components=1
          case_results=(--case-result t02-result.json --case-result t08-result.json)
          if [ -f t12-result.json ]; then
            case_results+=(--case-result t12-result.json)
          fi
          uv run --project implementations/tooling/python --frozen --no-default-groups python \
            -m tools.bootstrap_profile qualification-evidence \
            "${{ matrix.profile }}" "${{ github.sha }}" \
            "github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}" \
            --python-artifact-id cpython-3.14 "${case_results[@]}" \
            --offline-kit-root .qualification-evidence-root --offline-kit bootstrap-offline-kit.tar \
            --offline-kit-manifest-sha256 "${{ steps.kit.outputs.manifest_sha256 }}" \
            > bootstrap-qualification.json
      - name: Retain bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-${{ matrix.profile }}-${{ github.sha }}
          path: |
            bootstrap-qualification.json
            bootstrap-offline-kit.tar
          if-no-files-found: error
