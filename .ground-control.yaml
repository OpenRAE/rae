schema_version: 2
project: aces-sdl
github_repo: OpenRAE/rae
workflow:
  test_command: RAES_REQUIREMENT_UID="${RAES_REQUIREMENT_UID:-$(printenv A""CES_REQUIREMENT_UID)}" uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-fast-feedback
  completion_command: RAES_REQUIREMENT_UID="${RAES_REQUIREMENT_UID:-$(printenv A""CES_REQUIREMENT_UID)}" uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-fast-feedback
  lint_command: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s lint
  format_command: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s hygiene
  policy_command: RAES_REQUIREMENT_UID="${RAES_REQUIREMENT_UID:-$(printenv A""CES_REQUIREMENT_UID)}" make policy
  precommit_command: RAES_REQUIREMENT_UID="${RAES_REQUIREMENT_UID:-$(printenv A""CES_REQUIREMENT_UID)}" pre-commit run
  codex_review:
    pre_push_cap: 1
  # Design checks for /implement. docs/develop/ground-control-design-checks.md
  # documents each command, the module map and the acceptance adapter.
  design:
    compile_command: d="$(mktemp -d)" && trap 'rm -rf "$d"' EXIT && PYTHONPYCACHEPREFIX="$d" uv run --project implementations/python --frozen --no-sync python -m compileall -q -j 2 -x '/\.venv/' implementations tools noxfile.py
    structural_command: uv run --project implementations/python --frozen --no-sync python tools/check_repo_policy.py --check-set structural && cd implementations/python && uv run --frozen --no-sync python -m pytest -p no:cacheprovider -q -n 2 tests/test_issue_1734_structural_ratchet.py tests/test_issue_1734_import_cycles.py tests/test_issue_1734_import_graph.py tests/test_issue_1734_private_imports.py tests/test_issue_1734_class_ancestry.py tests/test_issue_1711_layer_direction.py tests/test_issue_1711_structural_checks.py
    wiring_command: uv run --project implementations/tooling/python --frozen --no-sync python tools/design_wiring.py
    acceptance_command: uv run --project implementations/python --frozen --no-sync python tools/design_acceptance.py
  review_disposition:
    enabled: false
    mode: shadow
    max_auto_overrides: 0
    judge:
      enabled: false
docs:
  adr_dir: docs/decisions/adrs/
example_paths:
  source: implementations/python/packages/
  test: implementations/python/tests/
requirements:
  uid_examples:
    - GOV-918
    - RUN-311
    - ADR-012
routing:
  enabled: true
  default_provider: claude
  stages: {}
sonarcloud:
  project_key: Brad-Edwards_aces
  organization: brad-edwards
rules:
  plan_rules: .gc/plan-rules.md
