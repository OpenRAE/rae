schema_version: 1
project: aces-sdl
github_repo: OpenRAE/rae
workflow:
  base_branch: go-cutover
  test_command: RAES_REQUIREMENT_UID="${RAES_REQUIREMENT_UID:-$(printenv A""CES_REQUIREMENT_UID)}" uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-fast-feedback
  completion_command: RAES_REQUIREMENT_UID="${RAES_REQUIREMENT_UID:-$(printenv A""CES_REQUIREMENT_UID)}" uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s verify-fast-feedback
  lint_command: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s lint
  format_command: uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s hygiene
  policy_command: RAES_REQUIREMENT_UID="${RAES_REQUIREMENT_UID:-$(printenv A""CES_REQUIREMENT_UID)}" make policy
  precommit_command: RAES_REQUIREMENT_UID="${RAES_REQUIREMENT_UID:-$(printenv A""CES_REQUIREMENT_UID)}" pre-commit run
  design:
    compile_command: go -C implementations/tooling/go build ./...
    structural_command: >-
      d="$(mktemp -d)" && trap 'rm -rf "$d"' EXIT &&
      go -C implementations/tooling/go build -o "$d/archcheck" ./cmd/archcheck &&
      toolchain_root="$(go -C implementations/tooling/go env GOROOT)" && PATH="$toolchain_root/bin:$PATH" "$d/archcheck"
    wiring_command: >-
      d="$(mktemp -d)" && trap 'rm -rf "$d"' EXIT &&
      go -C implementations/tooling/go build -o "$d/archcheck" ./cmd/archcheck &&
      toolchain_root="$(go -C implementations/tooling/go env GOROOT)" && PATH="$toolchain_root/bin:$PATH" "$d/archcheck" -view
    acceptance_command: |
      request=$(cat)
      printf '%s' "$request" | jq -e '.test_file == "implementations/tooling/go/governance/acceptance_test.go"' >/dev/null || exit 1
      test=$(printf '%s' "$request" | jq -er '.test_name | select(test("^Test[A-Za-z0-9_]+$"))') || exit 1
      output=$(mktemp)
      trap 'rm -f "$output"' EXIT
      go -C implementations/tooling/go test -json ./governance -run "^${test}$" -count=1 >"$output" || :
      jq -s --arg name "$test" '{test_name: $name,
        matches: ([.[] | select(.Action == "run" and .Test == $name)] | length),
        status: (if any(.[]; .Action == "fail" and .Test == $name) then "failed"
          elif any(.[]; .Action == "pass" and .Test == $name) then "passed" else "broken" end),
        message: ([.[] | select(.Test == $name and .Action == "output") | .Output] | join("") | .[:4000])}' "$output"
  codex_review:
    pre_push_cap: 1
  review_disposition:
    enabled: false
    mode: shadow
    max_auto_overrides: 0
    judge:
      enabled: false
docs:
  adr_dir: docs/decisions/adrs/
example_paths:
  source: implementations/python/packages/
  test: implementations/python/tests/
requirements:
  uid_examples:
    - GOV-918
    - RUN-311
    - ADR-012
routing:
  enabled: true
  default_provider: claude
  stages: {}
sonarcloud:
  project_key: Brad-Edwards_aces
  organization: brad-edwards
rules:
  plan_rules: .gc/plan-rules.md
architecture:
  modules:
    - path: .
      implementations:
        - implementations/tooling/go/arch/model.go
        - tools/check_repo_policy.py
      adrs:
        - docs/decisions/adrs/adr-009-normative-artifact-authority-and-repository-structure.md
        - docs/decisions/adrs/adr-014-nox-as-canonical-verification-graph.md
        - docs/decisions/adrs/adr-122-go-architecture-model.md
    - path: implementations/tooling/go
      implementations:
        - implementations/tooling/go/cmd/archcheck/main.go
        - tools/policy/common.py
        - tools/policy/repo_policy.py
      adrs:
        - docs/decisions/adrs/adr-059-adr-amendment-policy-and-pin-gate.md
        - docs/decisions/adrs/adr-096-identity-cutover-and-historical-record-boundary.md
        - docs/decisions/adrs/adr-121-go-engineering-standards.md
        - docs/decisions/adrs/adr-122-go-architecture-model.md
