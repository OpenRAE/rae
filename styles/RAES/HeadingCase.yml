extends: capitalization
message: "Use sentence case for headings: found '%s'; expected '%s'."
level: error
scope: heading
match: $sentence
exceptions:
  - Go
  - ADR-122
  - MOD-001
  - GOV-928
  - API
  # The vocabulary lists lowercase 'backend', so a heading's first word needs this exception.
  - Backend
  - CLI
  - Conformance
  - GitHub
  - JSON
  - MCP
  - OpenSSF
  - PyPI
  - Python
  - RAES
  - Reproducible Agentic Environments System
  - Release
  - Please
  - SDL
  - URI
  - SARIF
  - Vale
