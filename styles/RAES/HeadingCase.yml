extends: capitalization
message: "Use sentence case for headings: found '%s'; expected '%s'."
level: error
scope: heading
match: $sentence
exceptions:
  - Go
  - ADR-124
  - ASR-530
  - MOD-001
  - GOV-928
  - API
  # The vocabulary lists lowercase 'backend', so a heading's first word needs this exception.
  - Backend
  - CLI
  - Conformance
  - GitHub
  - JSON
  - MCP
  - OpenSSF
  - PyPI
  - Python
  - RAES
  - Reproducible Agentic Environments System
  - Release
  - Please
  - SDL
  - URI
  - UCO
  - SARIF
  - Vale
  # Proper nouns and acronyms that SDL reference headings name.
  - ADR
  - CAGE Challenge
  - CACAO
  - CybORG
  - CyRIS
  - Docker
  - OCR
  - OCSF
  - Open Cyber Range
  - STIX
