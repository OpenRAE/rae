# TechVault smoke-run design.
# Declare a small replication count through target_run_count.
# This design compares no conditions and selects nothing randomly.
# It is a pre-run input, not an observed smoke-test result. See ADR-074.
schema_version: experiment-authoring-input/v1
spec_id: spec-techvault-smoke-run-v1
spec_version: 1.0.0
title: TechVault smoke run
description: >-
  Minimal deterministic design: five runs of the TechVault task to
  smoke-test the apparatus before a full comparison sweep.

task_ref:
  ref_kind: task
  ref_id: task-techvault-red-team-v1
  ref_version: 1.0.0

run_plan:
  episode_control:
    turn_order: sequential
    max_steps: 100
    termination_rule: Terminate each episode after 100 logical steps (fixed horizon).
  # Specify exactly one of allocation and target_run_count. This example uses a run count.
  target_run_count: 5
