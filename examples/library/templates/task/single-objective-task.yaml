template: raes-library-template
version: 1
id: single-objective-task
surface: task
requirement_refs: [AUT-806]
source_refs:
  - docs/explain/sdl/sections.md
  - docs/explain/sdl/limitations.md
summary: Task template using current SDL objectives and conditions as the materialized task boundary.
body:
  name: library-task-template
  description: Task-oriented SDL wrapper using a single objective and success condition.
  nodes:
    target:
      type: compute
      resources: {ram: 1 GiB, cpu: 1}
      services:
        - {port: 22, name: ssh}
  conditions:
    task-complete:
      proposition: task-complete
      command: test -f /tmp/raes-task-complete
      interval: 15
  entities:
    participant:
      role: blue
  agents:
    task-agent:
      affiliations: [participant]
  propositions:
    task-complete:
      description: The governed task-complete observation is true for the addressed scenario subject.
      subjects:
      - nodes.target.services.ssh
      basis: observed_state
      predicate:
        kind: boolean
        property: task-complete
        semantic_ref: urn:raes:observable:task-complete
        operator: equals
        expected: true
      evidence_requirements: [objective-truth-evidence]
  assertions:
    task-complete:
      proposition: task-complete
      role: postcondition
      polarity: positive
  evidence_requirements:
    objective-truth-evidence:
      description: Capture evidence used to decide authored proposition assertions.
      source_refs:
      - nodes.target.services.ssh
      scope: authored assertion evaluation
      boundary_kind: assertion_evaluation
      channel: log
      artifact_role: proposition_truth_evidence
      media_types: [application/json]
      sensitivity: plain
      redaction: redact_secrets
      integrity: checksum
      retention: study_lifetime
      loss_disclosure: required
  objectives:
    complete-service-check-task:
      assigned_participant: task-agent
      targets: [nodes.target.services.ssh]
      success:
        assertions: [task-complete]
  workflows:
    task-flow:
      start: perform-task
      steps:
        perform-task:
          type: objective
          objective: complete-service-check-task
          on_success: done
        done:
          type: end
