template: raes-library-template
version: 1
id: timed-run-control
surface: run
requirement_refs: [AUT-806]
source_refs:
  - docs/explain/sdl/sections.md
  - docs/explain/sdl/validation.md
summary: Run template binding story/script timing to objective and workflow windows.
body:
  name: library-run-template
  description: Run-oriented SDL wrapper with a timed story, script, event, objective, and workflow.
  nodes:
    service:
      type: compute
      resources: {ram: 1 GiB, cpu: 1}
      services:
        - {port: 443, name: https}
  conditions:
    telemetry-ready:
      proposition: telemetry-ready
      command: test -f /var/lib/raes/telemetry-ready
      interval: 30
  injects:
    start-run:
      description: Operator starts the run window.
  events:
    run-start:
      assertions: [pre-telemetry-ready]
      injects: [start-run]
  scripts:
    run-script:
      start_time: 0
      end_time: 15 min
      speed: 1.0
      events:
        run-start: 1 min
  stories:
    run-story:
      speed: 1.0
      scripts: [run-script]
  entities:
    operator-team:
      role: blue
  agents:
    run-operator:
      affiliations: [operator-team]
  propositions:
    telemetry-ready:
      description: The governed telemetry-ready observation is true for the addressed scenario subject.
      subjects:
      - nodes.service.services.https
      basis: observed_state
      predicate:
        kind: boolean
        property: telemetry-ready
        semantic_ref: urn:raes:observable:telemetry-ready
        operator: equals
        expected: true
      evidence_requirements: [objective-truth-evidence]
  assertions:
    telemetry-ready:
      proposition: telemetry-ready
      role: postcondition
      polarity: positive
    pre-telemetry-ready:
      proposition: telemetry-ready
      role: precondition
      polarity: positive
  evidence_requirements:
    objective-truth-evidence:
      description: Capture evidence used to decide authored proposition assertions.
      source_refs:
      - nodes.service.services.https
      scope: authored assertion evaluation
      boundary_kind: assertion_evaluation
      channel: log
      artifact_role: proposition_truth_evidence
      media_types: [application/json]
      sensitivity: plain
      redaction: redact_secrets
      integrity: checksum
      retention: study_lifetime
      loss_disclosure: required
  objectives:
    observe-run-telemetry:
      assigned_participant: run-operator
      targets: [nodes.service.services.https]
      success:
        assertions: [telemetry-ready]
      window:
        stories: [run-story]
        scripts: [run-script]
        events: [run-start]
  workflows:
    run-control:
      start: observe
      steps:
        observe:
          type: objective
          objective: observe-run-telemetry
          on_success: done
        done:
          type: end
