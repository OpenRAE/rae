template: raes-library-template
version: 1
id: seeded-run-plan
surface: run
requirement_refs: [AUT-806, EXP-736]
source_refs:
  - docs/decisions/adrs/adr-074-experiment-authoring-input-contract-boundary.md
  - examples/experiments/techvault-smoke-run.exp.yaml
summary: Describe repeated, seeded runs of one task with sequential turns and a step limit before execution.
validation:
  - command: uv run --project implementations/python --frozen python tools/check_example_library.py
    expected: Exits 0 with no output. The gate uses the experiment authoring-input loader. Its YAML reader rejects duplicate keys, aliases, and << merge keys in this file. It passes the body to parse_experiment_spec. Any reported error fails the gate.
  - command: 'uv run --project implementations/python --frozen python -c "import sys; from pathlib import Path; from raes_contracts.experiment_spec import load_experiment_spec; print(load_experiment_spec(Path(sys.argv[1])).spec_id)" my-experiment.exp.yaml'
    expected: With the body saved as my-experiment.exp.yaml, prints its spec_id and exits 0. An invalid document raises ExperimentSpecValidationError and exits 1.
body:
  schema_version: experiment-authoring-input/v1
  spec_id: library-seeded-run-plan
  spec_version: 1.0.0
  title: Seeded run plan
  description: Ten seeded runs of one task with sequential turns and a fixed step limit.
  task_ref:
    ref_kind: task
    ref_id: task-example-v1
    ref_version: 1.0.0
  run_plan:
    stochastic_controls:
      - control_id: base-seed
        role: seed
        value: 1234
        description: Base seed for the plan. How each run derives its seed is not declared here.
    episode_control:
      turn_order: sequential
      max_steps: 50
      termination_rule: End each episode after 50 logical steps.
    target_run_count: 10
  validity_notes:
    - category: reproducibility
      note: The seed is descriptive. It does not make this plan an executable random-stream contract.
