template: raes-library-template
version: 1
id: observational-study-protocol
surface: study
requirement_refs: [AUT-806]
source_refs:
  - docs/explain/sdl/sections.md
  - docs/decisions/adrs/adr-073-scoring-reward-language-scope.md
summary: Study template connecting a task outcome to an observable condition, objective, and workflow protocol. Graded scoring lives in the experiment/evaluator plane per ADR-073.
body:
  name: library-study-template
  description: Study-oriented SDL wrapper whose objective asserts observable success via a condition. Graded scoring and reward are experiment/evaluator-plane concerns per ADR-073, not SDL surfaces.
  nodes:
    study-target:
      type: compute
      resources: {ram: 1 GiB, cpu: 1}
      services:
        - {port: 443, name: https}
  conditions:
    study-task-success:
      proposition: study-task-success
      command: test -f /var/lib/raes/study-task-success
      interval: 30
  entities:
    participant-team:
      role: blue
  agents:
    study-participant:
      affiliations: [participant-team]
  propositions:
    study-task-success:
      description: The governed study-task-success observation is true for the addressed scenario subject.
      subjects:
      - nodes.study-target.services.https
      basis: observed_state
      predicate:
        kind: boolean
        property: study-task-success
        semantic_ref: urn:raes:observable:study-task-success
        operator: equals
        expected: true
      evidence_requirements: [objective-truth-evidence]
  assertions:
    study-task-success:
      proposition: study-task-success
      role: postcondition
      polarity: positive
  evidence_requirements:
    objective-truth-evidence:
      description: Capture evidence used to decide authored proposition assertions.
      source_refs:
      - nodes.study-target.services.https
      scope: authored assertion evaluation
      boundary_kind: assertion_evaluation
      channel: log
      artifact_role: proposition_truth_evidence
      media_types: [application/json]
      sensitivity: plain
      redaction: redact_secrets
      integrity: checksum
      retention: study_lifetime
      loss_disclosure: required
  objectives:
    complete-study-task:
      assigned_participant: study-participant
      targets: [nodes.study-target.services.https]
      success:
        assertions: [study-task-success]
  workflows:
    study-protocol:
      start: complete-task
      steps:
        complete-task:
          type: objective
          objective: complete-study-task
          on_success: done
        done:
          type: end
