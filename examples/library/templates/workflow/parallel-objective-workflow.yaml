template: raes-library-template
version: 1
id: parallel-objective-workflow
surface: workflow
requirement_refs: [AUT-806]
source_refs:
  - docs/explain/sdl/sections.md
  - docs/explain/sdl/validation.md
summary: Parallel workflow template with explicit branch convergence through a join step.
body:
  name: library-workflow-template
  description: Workflow template showing parallel objective branches converging at an explicit join.
  nodes:
    service:
      type: compute
      resources: {ram: 1 GiB, cpu: 1}
      services:
        - {port: 443, name: https}
  conditions:
    patch-applied:
      proposition: patch-applied
      command: test -f /var/lib/raes/patch-applied
      interval: 30
    service-verified:
      proposition: service-verified
      command: curl -fsS https://service/health
      interval: 30
  entities:
    blue-team:
      role: blue
  agents:
    operator:
      affiliations: [blue-team]
  propositions:
    patch-applied:
      description: The governed patch-applied observation is true for the addressed scenario subject.
      subjects:
      - nodes.service
      basis: observed_state
      predicate:
        kind: boolean
        property: patch-applied
        semantic_ref: urn:raes:observable:patch-applied
        operator: equals
        expected: true
      evidence_requirements: [objective-truth-evidence]
    service-verified:
      description: The governed service-verified observation is true for the addressed scenario subject.
      subjects:
      - nodes.service.services.https
      basis: observed_state
      predicate:
        kind: boolean
        property: service-verified
        semantic_ref: urn:raes:observable:service-verified
        operator: equals
        expected: true
      evidence_requirements: [objective-truth-evidence]
  assertions:
    patch-applied:
      proposition: patch-applied
      role: postcondition
      polarity: positive
    service-verified:
      proposition: service-verified
      role: postcondition
      polarity: positive
  evidence_requirements:
    objective-truth-evidence:
      description: Capture evidence used to decide authored proposition assertions.
      source_refs:
      - nodes.service.services.https
      - nodes.service
      scope: authored assertion evaluation
      boundary_kind: assertion_evaluation
      channel: log
      artifact_role: proposition_truth_evidence
      media_types: [application/json]
      sensitivity: plain
      redaction: redact_secrets
      integrity: checksum
      retention: study_lifetime
      loss_disclosure: required
  objectives:
    apply-patch:
      assigned_participant: operator
      targets: [nodes.service]
      success:
        assertions: [patch-applied]
    verify-service:
      assigned_participant: operator
      targets: [nodes.service.services.https]
      success:
        assertions: [service-verified]
  workflows:
    parallel-remediation:
      start: fan-out
      steps:
        fan-out:
          type: parallel
          branches: [patch-step, verify-step]
          join: converge
        patch-step:
          type: objective
          objective: apply-patch
          on_success: converge
        verify-step:
          type: objective
          objective: verify-service
          on_success: converge
        converge:
          type: join
          next: done
        done:
          type: end
