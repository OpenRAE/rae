template: raes-library-template
version: 1
id: tool-affordance
surface: participant_behavior
requirement_refs: [AUT-806, DSL-117]
source_refs:
  - docs/explain/sdl/sections.md
  - implementations/python/tests/test_sem_208_participant_behavior.py
summary: Participant behavior template that binds a declared tool content item to one action contract and one observation boundary through a tool affordance.
validation:
  - command: uv run --project implementations/python --frozen python tools/check_example_library.py
    expected: Exits 0 with no output. The gate loads this file as YAML, parses the loaded body with the SDL parser and semantic validator, and fails on any error or advisory. Loading keeps the last value of a duplicate key, so the gate does not report duplicate keys.
  - command: uv run --project implementations/python --frozen raes semantic validate my-scenario.sdl.yaml
    expected: 'With the body saved as my-scenario.sdl.yaml, prints "validate: success" and exits 0. This command does not report semantic-validator advisories.'
body:
  name: library-tool-affordance-template
  description: Participant behavior template with a tool affordance over a declared tool content item.
  nodes:
    web:
      type: compute
      resources: {ram: 1 GiB, cpu: 1}
      services:
        - {port: 80, name: http}
  content:
    scanner-package:
      type: file
      target: web
      path: /opt/tools/scanner
  entities:
    red-team:
      role: red
  action_contracts:
    scan:
      semantic_version: 1.0.0
      behavioral_granularity: atomic
      procedure_basis: service discovery against the web node
      realization_profile: backend-declared
      fidelity_claim: records participant discovery intent and terminal observation
      preconditions:
        - precondition_id: authority-in-scope
          precondition_class: authority
          description: the participant is authorized to scan the web service
      effects:
        - effect_id: terminal-scan-observation
          effect_class: observation_effect
          description: terminal scan observation
          evidence_refs: [evidence.scan-output]
      failure_classes: [backend_error, unknown]
  observation_boundaries:
    red-view:
      projection_basis: participant-local view of the scanner and its results
      observable_refs: [behavior_specifications.red-scan-behavior.tool_affordances.network-scanner]
      evidence_refs: [evidence.scan-output]
      redaction_policy: no hidden refs are disclosed
      latency_profile: terminal observation after the scan completes
      view_rules:
        - information_ref: behavior_specifications.red-scan-behavior.tool_affordances.network-scanner
          boundary_class: observable_resource
          disposition: observable
          visibility_basis: authored participant-local affordance
  agents:
    red-agent:
      affiliations: [red-team]
      actions: [scan]
      observation_boundaries: [red-view]
  behavior_specifications:
    red-scan-behavior:
      semantic_version: 1.0.0
      participant_refs: [red-agent]
      action_contract_refs: [scan]
      observation_boundary_refs: [red-view]
      tool_affordances:
        network-scanner:
          tool_ref: scanner-package
          action_contract_refs: [scan]
          observation_boundary_refs: [red-view]
