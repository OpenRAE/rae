template: raes-library-template
version: 1
id: minimal-validated-scenario
surface: scenario
requirement_refs: [AUT-806]
source_refs:
  - docs/explain/sdl/sections.md
  - docs/explain/sdl/validation.md
summary: Minimal current-SDL scenario with a target, participant, objective, and workflow.
body:
  name: library-scenario-template
  description: Minimal scenario template exercising identity, target, objective, and workflow refs.
  nodes:
    app:
      type: compute
      architecture: x86_64
      resources: {ram: 1 GiB, cpu: 1}
      services:
        - {port: 443, name: https}
  conditions:
    app-healthy:
      proposition: app-healthy
      command: curl -fsS https://app/health
      interval: 30
  entities:
    blue-team:
      role: blue
  agents:
    operator:
      affiliations: [blue-team]
  propositions:
    app-healthy:
      description: The governed app-healthy observation is true for the addressed scenario subject.
      subjects:
      - nodes.app.services.https
      basis: observed_state
      predicate:
        kind: boolean
        property: app-healthy
        semantic_ref: urn:raes:observable:app-healthy
        operator: equals
        expected: true
      evidence_requirements: [objective-truth-evidence]
  assertions:
    app-healthy:
      proposition: app-healthy
      role: postcondition
      polarity: positive
  evidence_requirements:
    objective-truth-evidence:
      description: Capture evidence used to decide authored proposition assertions.
      source_refs:
      - nodes.app.services.https
      scope: authored assertion evaluation
      boundary_kind: assertion_evaluation
      channel: log
      artifact_role: proposition_truth_evidence
      media_types: [application/json]
      sensitivity: plain
      redaction: redact_secrets
      integrity: checksum
      retention: study_lifetime
      loss_disclosure: required
  objectives:
    verify-app-health:
      assigned_participant: operator
      targets: [nodes.app.services.https]
      success:
        assertions: [app-healthy]
  workflows:
    baseline-check:
      start: verify
      steps:
        verify:
          type: objective
          objective: verify-app-health
          on_success: done
        done:
          type: end
