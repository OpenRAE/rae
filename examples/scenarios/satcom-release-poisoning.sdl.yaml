objectives:
  red-compromise-build:
    agent: red-build-agent
    actions:
    - Exploit
    - StealToken
    targets:
    - ci-runner
    - support-bastion
    - forge-auths-ci
    success:
      assertions:
      - rogue-release-promoted
    window:
      stories:
      - release-day
      scripts:
      - release-prep
  red-poison-release:
    agent: red-build-agent
    actions:
    - PushArtifact
    targets:
    - release-manifest
    - artifact-registry
    - ci-publishes-registry
    success:
      assertions:
      - rogue-release-promoted
    window:
      stories:
      - release-day
      scripts:
      - canary-rollout
      events:
      - canary-cutover-event
    depends_on:
    - red-compromise-build
  red-reach-edge:
    entity: red-supply-chain
    targets:
    - edge-gateway-east
    - control-manages-east
    success:
      assertions:
      - edge-east-poisoned
    window:
      stories:
      - release-day
      scripts:
      - incident-rollback
      events:
      - rollback-order-event
    depends_on:
    - red-poison-release
  blue-validate-release:
    agent: blue-release-agent
    actions:
    - Review
    - Revoke
    targets:
    - artifact-registry
    - signing-hsm
    - registry-relies-signing
    success:
      assertions:
      - release-signature-valid
    window:
      stories:
      - release-day
      scripts:
      - release-prep
      - canary-rollout
      workflows:
      - release-response
      steps:
      - release-response.validate-release
  blue-revoke-artifact:
    agent: blue-release-agent
    actions:
    - Revoke
    - Rollback
    targets:
    - release-manifest
    - artifact-registry
    - nodes.artifact-registry.services.registry-api
    - infrastructure.build-net.acls.allow-engineering-release
    success:
      assertions:
      - rollback-package-ready
    window:
      stories:
      - release-day
      scripts:
      - incident-rollback
      events:
      - rollback-order-event
      workflows:
      - release-response
      steps:
      - release-response.revoke-artifact
    depends_on:
    - blue-validate-release
  blue-preserve-service:
    agent: blue-sre-agent
    actions:
    - Inspect
    - Isolate
    - Restore
    - Validate
    targets:
    - control-api
    - edge-gateway-east
    - telemetry-broker
    - telemetry-replicates-analytics
    success:
      assertions:
      - telemetry-flowing
      - tenant-isolation-healthy
    window:
      stories:
      - release-day
      scripts:
      - incident-rollback
      workflows:
      - release-response
      steps:
      - release-response.rollback-edge
    depends_on:
    - blue-validate-release
    - red-reach-edge
workflows:
  release-response:
    description: 'Release-control workflow that validates a canary, branches on poisoned
      promotion, and fans out rollback work when needed.

      '
    start: validate-release
    steps:
      validate-release:
        type: objective
        objective: blue-validate-release
        on_success: branch-on-promotion
      branch-on-promotion:
        type: decision
        when:
          assertions:
          - pre-rogue-release-promoted
        then: rollback-fanout
        else: finish
      rollback-fanout:
        type: parallel
        branches:
        - revoke-artifact
        - rollback-edge
        join: rollback-joined
      revoke-artifact:
        type: objective
        objective: blue-revoke-artifact
        on_success: rollback-joined
      rollback-edge:
        type: objective
        objective: blue-preserve-service
        on_success: rollback-joined
      rollback-joined:
        type: join
        next: verify-rollback
      verify-rollback:
        type: decision
        when:
          steps:
          - step: revoke-artifact
            outcomes:
            - succeeded
        then: finish
        else: revalidate-release
      revalidate-release:
        type: objective
        objective: blue-validate-release
        on_success: finish
      finish:
        type: end
variables:
  release_story_speed:
    type: number
    default: 1.25
    description: Playback speed for the release-day story
  release_engineer_password_strength:
    type: string
    default: strong
    description: Password posture for release engineering operator accounts
  canary_cutover:
    type: string
    default: 2 hour 45 min
    description: When canary promotion begins
  rollback_deadline:
    type: string
    default: 6 hour
    description: Time by which rollback should be complete
