name: cloud-secret-cross-project
description: >-
  Synthetic ownership, identity and secret-state description. Evidence references
  are illustrative. This example makes no cloud deployment or access proof claim.
nodes:
  worker:
    type: compute
  iam:
    type: compute
    runtime:
      identity_authorities:
        - identity_authority_id: cloud
          kind: cloud_iam
          resource_scopes:
            - scope_id: project-a
              provider: gcp
              scope_kind: project
              native_id: project-a
            - scope_id: project-b
              provider: gcp
              scope_kind: project
              native_id: project-b
          subjects:
            - subject_id: worker
              kind: service_account
              name: worker
              resource_scope_ref: nodes.iam.runtime.identity_authorities.cloud.resource_scopes.project-a
            - subject_id: requester
              kind: user
              name: requester
              resource_scope_ref: nodes.iam.runtime.identity_authorities.cloud.resource_scopes.project-a
          identity_uses:
            - use_id: worker-use
              workload_ref: nodes.worker
              principal_ref: nodes.iam.runtime.identity_authorities.cloud.subjects.worker
              source_principal_ref: nodes.iam.runtime.identity_authorities.cloud.subjects.requester
              mode: impersonated
          policies:
            - policy_id: reader
              policy_kind: access
              resource_access:
                attachment_ref: nodes.iam.runtime.identity_authorities.cloud.resource_scopes.project-b
                bindings:
                  - binding_id: metadata
                    principal_refs: [nodes.iam.runtime.identity_authorities.cloud.subjects.worker]
                    resource_refs: [nodes.secrets.runtime.platform_applications.manager.secrets.database]
                    actions: [secretmanager.secrets.get]
                    effect: allow
                  - binding_id: read
                    principal_refs: [nodes.iam.runtime.identity_authorities.cloud.subjects.worker]
                    resource_refs: [nodes.secrets.runtime.platform_applications.manager.secrets.database]
                    actions: [secretmanager.versions.access]
                    effect: allow
            - policy_id: identity-use
              policy_kind: access
              resource_access:
                attachment_ref: nodes.iam.runtime.identity_authorities.cloud.subjects.worker
                bindings:
                  - binding_id: impersonate
                    principal_refs: [nodes.iam.runtime.identity_authorities.cloud.subjects.requester]
                    resource_refs: [nodes.iam.runtime.identity_authorities.cloud.subjects.worker]
                    actions: [iam.serviceAccounts.getAccessToken]
                    effect: allow
            - policy_id: inherited-secret
              policy_kind: access
              resource_access:
                attachment_ref: nodes.secrets.runtime.platform_applications.manager.secrets.database
                inherited_from_ref: nodes.iam.runtime.identity_authorities.cloud.policies.reader
          access_observations:
            - observation_id: metadata-read
              principal_ref: nodes.iam.runtime.identity_authorities.cloud.subjects.worker
              action: secretmanager.secrets.get
              resource_ref: nodes.secrets.runtime.platform_applications.manager.secrets.database
              outcome: allowed
              evidence_refs: [urn:example:metadata-attempt]
            - observation_id: denied-version
              principal_ref: nodes.iam.runtime.identity_authorities.cloud.subjects.worker
              action: secretmanager.versions.access
              resource_ref: nodes.secrets.runtime.platform_applications.manager.secrets.database.versions.v2
              outcome: denied
              evidence_refs: [urn:example:denied-attempt]
  secrets:
    type: compute
    services:
      - name: api
        protocol: tcp
        port: 443
    runtime:
      platform_applications:
        - platform_application_id: manager
          service: api
          product: GCP Secret Manager
          secrets:
            - secret_id: database
              resource_scope_ref: nodes.iam.runtime.identity_authorities.cloud.resource_scopes.project-b
              native_id: database
              versions:
                - version_id: v1
                  native_id: '1'
                  state: enabled
                - version_id: v2
                  native_id: '2'
                  state: disabled
                - version_id: v3
                  native_id: '3'
                  state: destroyed
              consumers:
                - selection_id: exact-version
                  consumer_ref: nodes.worker
                  version_ref: nodes.secrets.runtime.platform_applications.manager.secrets.database.versions.v2
                - selection_id: alias-report
                  consumer_ref: nodes.worker
                  selector: {kind: alias, value: latest}
                  resolved_version_ref: nodes.secrets.runtime.platform_applications.manager.secrets.database.versions.v1
                  resolution_basis: observed
                  resolution_evidence_refs: [urn:example:alias-resolution]
