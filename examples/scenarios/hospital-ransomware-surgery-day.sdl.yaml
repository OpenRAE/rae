assertions:
  backup-catalog-intact:
    proposition: backup-catalog-intact
    role: postcondition
    polarity: positive
  clinical-disruption-observed:
    proposition: clinical-disruption-observed
    role: postcondition
    polarity: positive
  ehr-api-healthy:
    proposition: ehr-api-healthy
    role: postcondition
    polarity: positive
  pacs-archive-healthy:
    proposition: pacs-archive-healthy
    role: postcondition
    polarity: positive
  phi-staging-observed:
    proposition: phi-staging-observed
    role: postcondition
    polarity: positive
  radiology-workflow-delayed:
    proposition: radiology-workflow-delayed
    role: postcondition
    polarity: positive
  soc-pipeline-up:
    proposition: soc-pipeline-up
    role: postcondition
    polarity: positive
  triage-case-submitted:
    proposition: triage-case-submitted
    role: postcondition
    polarity: positive
  vendor-session-established:
    proposition: vendor-session-established
    role: postcondition
    polarity: positive
  pre-clinical-disruption-observed:
    proposition: clinical-disruption-observed
    role: precondition
    polarity: positive
  pre-phish-mail-delivered:
    proposition: phish-mail-delivered
    role: precondition
    polarity: positive
evidence_requirements:
  objective-truth-evidence:
    description: Capture evidence used to decide authored proposition assertions.
    source_refs:
    - nodes.ehr-frontend
    - nodes.backup-vault
    - nodes.exchange01
    - nodes.siem01
    - nodes.pacs01
    - nodes.vpn-gateway
    - nodes.ehr-db
    scope: authored objective, event, workflow, and participant assertion evaluation
    boundary_kind: assertion_evaluation
    channel: log
    artifact_role: proposition_truth_evidence
    media_types: [application/json]
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: study_lifetime
    loss_disclosure: required
entities:
  hospital-blue:
    name: Hospital Blue Team
    role: blue
    mission: Keep patient care and core services available throughout the incident
    entities:
      soc:
        name: SOC
      identity:
        name: Identity Engineering
      clinical-it:
        name: Clinical IT
      recovery:
        name: Recovery Cell
  vendor-support:
    name: Vendor Support
    role: green
    mission: Maintain third-party support connection for imaging systems
  ransom-crew:
    name: Ransom Crew
    role: red
    mission: Steal PHI and disrupt radiology before the surgery window closes
  white-cell:
    name: White Cell
    role: white
injects:
  vendor-advisory:
    source:
      name: vendor-advisory-pdf
      version: '*'
    from_entity: white-cell
    to_entities:
    - hospital-blue
    - vendor-support
    description: Advisory about intermittent VPN instability from the imaging vendor
  phishing-wave:
    source:
      name: payroll-lure-pack
      version: '*'
    from_entity: ransom-crew
    to_entities:
    - hospital-blue
    - vendor-support
    description: Phishing lure targeting helpdesk and vendor support personnel
  surgery-escalation:
    source:
      name: operating-room-escalation
