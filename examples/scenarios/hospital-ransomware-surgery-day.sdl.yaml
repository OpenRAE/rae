      name: adfs
      version: '*'
  exchange-mailbox:
    type: service
    source:
      name: exchange-mailbox-role
      version: '*'
  ehr-service:
    type: service
    source:
      name: epic-web
      version: '*'
  sql-cluster:
    type: service
    source:
      name: postgresql-ha
