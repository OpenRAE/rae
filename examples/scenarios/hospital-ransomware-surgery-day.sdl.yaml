events:
  morning-advisory:
    injects:
    - vendor-advisory
  phishing-delivery:
    assertions:
    - pre-phish-mail-delivered
    injects:
    - phishing-wave
  surgery-pressure:
    assertions:
    - pre-clinical-disruption-observed
    injects:
    - surgery-escalation
scripts:
  pre-surgery:
    start_time: 0
    end_time: 7200
    speed: ${surgery_day_speed}
    events:
      morning-advisory: 600
      phishing-delivery: 2700
  live-clinic:
    start_time: 7200
    end_time: 18000
    speed: ${surgery_day_speed}
    events:
      surgery-pressure: 10800
  recovery-window:
    start_time: 18000
    end_time: ${recovery_window}
    speed: ${surgery_day_speed}
    events:
      surgery-pressure: 21600
stories:
  surgery-day:
    speed: ${surgery_day_speed}
    scripts:
    - pre-surgery
    - live-clinic
    - recovery-window
content:
  phi-records:
    type: dataset
    target: ehr-db
    source:
      name: synthetic-phi-seed
      version: '*'
