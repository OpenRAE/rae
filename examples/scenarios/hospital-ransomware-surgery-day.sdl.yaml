name: hospital-ransomware-surgery-day
description: 'Surgery-day ransomware exercise for a regional hospital. The scenario
  combines phishing, vendor access abuse, identity pivoting, EHR/PACS disruption,
  and backup-driven recovery under clinical time pressure.

  '
nodes:
  internet-edge:
    type: switch
    description: Public ingress for email, VPN, and external access
  vendor-segment:
    type: switch
    description: Third-party support access zone
  corp-it:
    type: switch
    description: Corporate productivity and identity-adjacent services
  clinical-it:
    type: switch
    description: Clinical application tier
  identity-net:
    type: switch
    description: Active Directory and SSO infrastructure
  security-net:
    type: switch
    description: SIEM and response tooling network
  backup-net:
    type: switch
    description: Backup and recovery network
  mail-gateway:
    type: compute
    source:
      name: secure-mail-gateway
      version: '*'
    resources:
      ram: 2147483648
      cpu: 1
    os: linux
    features:
      mail-relay: mail-admin
    conditions:
      mail-queue-healthy: mail-admin
    roles:
      mail-admin:
        username: postfix
    services:
    - port: 25
      name: smtp-inbound
    - port: 443
      name: mail-admin-ui
  vpn-gateway:
    type: compute
    source:
      name: vpn-concentrator
      version: '*'
    resources:
      ram: 2147483648
      cpu: 2
    os: linux
    features:
      vpn-concentrator: vpn-admin
    conditions:
      vpn-auth-healthy: vpn-admin
      vendor-session-established: vpn-admin
    roles:
      vpn-admin:
        username: netops
        entities:
        - hospital-blue.identity
    services:
    - port: 443
      name: vpn-portal
    - port: 1194
      protocol: udp
      name: vpn-tunnel
  ad01:
    type: compute
    source:
      name: windows-ad
      version: '*'
    resources:
      ram: 4294967296
      cpu: 2
    os: windows
    os_distribution: windows-server
    os_version: '2022'
    features:
      hospital-ad: domain-admin
      hospital-adfs: federation-admin
    conditions:
      domain-auth-healthy: domain-admin
      sso-healthy: federation-admin
    roles:
      domain-admin:
        username: Administrator
        entities:
        - hospital-blue.identity
      federation-admin:
        username: adfs_svc
    services:
    - port: 53
      protocol: udp
      name: ad-dns
    - port: 389
      name: ad-ldap
    - port: 443
      name: adfs-https
    runtime:
      identity_authorities:
      - identity_authority_id: hospital-domain
        kind: domain
        name: Hospital Active Directory Domain
        namespace: hospital.local
        domain_name: HOSPITAL
        realm: HOSPITAL.LOCAL
        base_dn: DC=hospital,DC=local
        services:
        - service_id: ldap-endpoint
          service: ad-ldap
          protocol: ldap
          address: dc.hospital.local
          port: 389
        subjects:
        - subject_id: nurse-user
          kind: user
          name: nurse.jane
          principal_name: nurse.jane@HOSPITAL.LOCAL
          distinguished_name: CN=nurse.jane,OU=Clinical,DC=hospital,DC=local
          domain: hospital.local
          enabled: true
          origin: directory
          attributes:
          - name: objectGUID
            values:
            - hospital-guid-nurse-jane
            origin: directory
        - subject_id: clinical-group
          kind: group
          name: Clinical
          distinguished_name: CN=Clinical,OU=Groups,DC=hospital,DC=local
          origin: directory
        - subject_id: surgery-group
          kind: group
          name: Surgery
          distinguished_name: CN=Surgery,OU=Groups,DC=hospital,DC=local
          origin: directory
        - subject_id: appservices-group
          kind: group
          name: AppServices
          distinguished_name: CN=AppServices,OU=Groups,DC=hospital,DC=local
          origin: directory
        - subject_id: ehr-service-principal
          kind: service_principal
          name: ehrsvc
          principal_name: ehrsvc@HOSPITAL.LOCAL
          origin: directory
          service_principal_names:
          - HTTP/ehr.hospital.local
        policies:
        - policy_id: default-domain-password-policy
          policy_kind: password
          name: Default Domain Password Policy
          applies_to_refs:
          - hospital-domain
          - ldap-endpoint
          - nurse-clinical-membership
          settings:
          - name: min_length
            values:
            - '14'
            origin: directory
          - name: history_count
            values:
            - '24'
            origin: directory
        relationships:
        - relationship_id: nurse-clinical-membership
          relationship_type: member_of
          source_ref: nurse-user
          target_ref: clinical-group
        - relationship_id: ehr-service-appservices-membership
          relationship_type: member_of
          source_ref: ehr-service-principal
          target_ref: appservices-group
      - identity_authority_id: hospital-adfs
        kind: identity_provider
        name: Hospital ADFS
        namespace: https://adfs.hospital.local
        issuer: https://adfs.hospital.local/adfs
        services:
        - service_id: adfs-saml
          service: adfs-https
          protocol: saml
          address: adfs.hospital.local
          port: 443
        subjects:
        - subject_id: ehr-application
          kind: application
          name: ehr-service
          principal_name: https://ehr.hospital.local/
          origin: federated
        relationships:
        - relationship_id: adfs-federates-ehr
          relationship_type: federates_with
          source_ref: hospital-adfs
          target_ref: ehr-application
  exchange01:
    type: compute
    source:
      name: exchange-2019
      version: '*'
    resources:
      ram: 4294967296
      cpu: 2
    os: windows
    os_distribution: windows-server
    os_version: '2019'
    features:
      exchange-mailbox: exchange-admin
    conditions:
      exchange-owa-healthy: exchange-admin
      phish-mail-delivered: exchange-admin
    roles:
      exchange-admin:
        username: exch_admin
        entities:
        - hospital-blue.identity
    services:
    - port: 443
      name: exchange-owa
    - port: 25
      name: exchange-smtp
  ehr-frontend:
    type: compute
    source:
      name: ehr-web-tier
      version: '*'
    resources:
      ram: 6442450944
      cpu: 4
    os: linux
    features:
      ehr-service: ehr-admin
    conditions:
      ehr-api-healthy: ehr-admin
      clinical-disruption-observed: ehr-admin
    roles:
      ehr-admin:
        username: ehrsvc
        entities:
        - hospital-blue.clinical-it
    services:
    - port: 443
      name: ehr-https
    - port: 8443
      name: ehr-admin-api
    asset_value:
      confidentiality: critical
      integrity: critical
      availability: critical
  ehr-db:
    type: compute
    source:
      name: postgres-cluster
      version: '*'
    resources:
      ram: 8589934592
      cpu: 4
    os: linux
    features:
      sql-cluster: dba
    conditions:
      ehr-db-healthy: dba
      phi-staging-observed: dba
    roles:
      dba:
        username: postgres
        entities:
        - hospital-blue.clinical-it
    services:
    - port: 5432
      name: ehr-postgres
    asset_value:
      confidentiality: critical
      integrity: critical
  pacs01:
    type: compute
    source:
      name: pacs-archive
      version: '*'
    resources:
      ram: 6442450944
      cpu: 4
    os: linux
    features:
      pacs-service: pacs-admin
    conditions:
      pacs-archive-healthy: pacs-admin
      radiology-workflow-delayed: pacs-admin
    roles:
      pacs-admin:
        username: pacs
        entities:
        - hospital-blue.clinical-it
    services:
    - port: 104
      name: dicom-store
    - port: 8444
      name: pacs-web-ui
    asset_value:
      confidentiality: high
      integrity: high
      availability: critical
  med-gateway:
    type: compute
    source:
      name: medical-device-broker
      version: '*'
    resources:
      ram: 2147483648
      cpu: 2
    os: linux
    features:
      device-broker: device-admin
    conditions:
      device-mesh-healthy: device-admin
    roles:
      device-admin:
        username: biomed
        entities:
        - hospital-blue.clinical-it
    services:
    - port: 8883
      name: med-mqtt
  backup-vault:
    type: compute
    source:
      name: immutable-backup-appliance
      version: '*'
    resources:
      ram: 4294967296
      cpu: 2
    os: linux
    features:
      immutable-backup: backup-admin
    conditions:
      backup-catalog-intact: backup-admin
      restore-runbook-ready: backup-admin
    roles:
      backup-admin:
        username: backupops
        entities:
        - hospital-blue.recovery
    services:
    - port: 443
      name: backup-api
    - port: 2049
      name: backup-nfs
  siem01:
    type: compute
    source:
      name: siem-stack
      version: '*'
    resources:
      ram: 8589934592
      cpu: 4
    os: linux
    features:
      siem-core: soc-admin
      edr-sensor: soc-admin
    conditions:
      soc-pipeline-up: soc-admin
      triage-case-submitted: soc-admin
    roles:
      soc-admin:
        username: socadmin
        entities:
        - hospital-blue.soc
    services:
    - port: 5601
      name: soc-ui
    - port: 9200
      name: soc-search
  vendor-jump:
    type: compute
    source:
      name: vendor-workstation
      version: '*'
    resources:
      ram: 2147483648
      cpu: 2
    os: windows
    os_distribution: windows-client
    os_version: '11'
    conditions:
      vendor-jump-online: support
    roles:
      support:
        username: support
        entities:
        - vendor-support
    services:
    - port: 3389
      name: vendor-rdp
infrastructure:
  internet-edge:
    count: 1
    properties:
      cidr: 10.70.0.0/24
      gateway: 10.70.0.1
  vendor-segment:
    count: 1
    properties:
      cidr: 10.70.1.0/24
      gateway: 10.70.1.1
      internal: true
    acls:
    - name: allow-public-vpn
      direction: in
      from_net: internet-edge
      protocol: tcp
      ports:
      - 443
      action: allow
    - name: deny-clinical-backflow
      direction: in
      from_net: clinical-it
      action: deny
  corp-it:
    count: 1
    properties:
      cidr: 10.70.2.0/24
      gateway: 10.70.2.1
      internal: true
    acls:
    - name: allow-public-mail-web
      direction: in
      from_net: internet-edge
      protocol: tcp
      ports:
      - 25
      - 443
      action: allow
    - name: allow-vendor-support
      direction: in
      from_net: vendor-segment
      protocol: tcp
      ports:
      - 443
      action: allow
  clinical-it:
    count: 1
    properties:
      cidr: 10.70.3.0/24
      gateway: 10.70.3.1
      internal: true
    acls:
    - name: allow-corp-clinical-apps
      direction: in
      from_net: corp-it
      protocol: tcp
      ports:
      - 443
      - 8443
      - 8444
      action: allow
    - name: allow-vendor-clinical-web
      direction: in
      from_net: vendor-segment
      protocol: tcp
      ports:
      - 443
      action: allow
    - name: deny-public-clinical
      direction: in
      from_net: internet-edge
      action: deny
  identity-net:
    count: 1
    properties:
      cidr: 10.70.4.0/24
      gateway: 10.70.4.1
      internal: true
    acls:
    - name: allow-corp-identity
      direction: in
      from_net: corp-it
      protocol: tcp
      ports:
      - 53
      - 389
      - 443
      action: allow
    - name: allow-clinical-identity
      direction: in
      from_net: clinical-it
      protocol: tcp
      ports:
      - 389
      - 443
      action: allow
  security-net:
    count: 1
    properties:
      cidr: 10.70.5.0/24
      gateway: 10.70.5.1
      internal: true
  backup-net:
    count: 1
    properties:
      cidr: 10.70.6.0/24
      gateway: 10.70.6.1
      internal: true
  mail-gateway:
    count: 1
    links:
    - internet-edge
    - corp-it
    - security-net
  vpn-gateway:
    count: 1
    links:
    - internet-edge
    - vendor-segment
    - corp-it
  ad01:
    count: 1
    links:
    - identity-net
    - corp-it
    - clinical-it
  exchange01:
    count: 1
    links:
    - corp-it
    - identity-net
    dependencies:
    - ad01
  ehr-frontend:
    count: 1
    links:
    - clinical-it
    - identity-net
    dependencies:
    - ehr-db
    - ad01
  ehr-db:
    count: 1
    links:
    - clinical-it
    - backup-net
    dependencies:
    - backup-vault
  pacs01:
    count: 1
    links:
    - clinical-it
    - backup-net
    dependencies:
    - backup-vault
  med-gateway:
    count: 1
    links:
    - clinical-it
    dependencies:
    - ehr-frontend
  backup-vault:
    count: 1
    links:
    - backup-net
    - security-net
  siem01:
    count: 1
    links:
    - security-net
    - corp-it
  vendor-jump:
    count: 1
    links:
    - vendor-segment
features:
  mail-relay:
    type: service
    source:
      name: postfix-relay
      version: '*'
  vpn-concentrator:
    type: service
    source:
      name: openvpn-appliance
