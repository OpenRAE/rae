fail_fast: true
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: nox-hygiene
        name: staged-file hygiene and secrets
        entry: bash -c 'unset $(git rev-parse --local-env-vars); uv run --project implementations/tooling/python --frozen --no-default-groups nox -f noxfile.py -s hygiene -- "$@"' --
        language: system
        pass_filenames: true
        require_serial: true
        stages: [pre-commit]
