# SonarCloud Configuration
# https://sonarcloud.io/project/overview?id=Brad-Edwards_aces

sonar.projectKey=Brad-Edwards_aces
sonar.organization=brad-edwards

# Quality gate (issue #527): make the scanner wait for the SonarCloud quality
# gate and fail the CI `sonar` job when the gate fails, so nothing merges past a
# failing gate. The assigned gate `raes-strict` fails on any new issue (plus
# new-code rating/coverage/duplication/hotspot conditions), mirroring
# `moonbase-strict`.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Source and test directories
#
# `tools/` (issue #54) is real production code — the ADR-015 policy gates,
# contract-schema generator/checker, requirement-governance enforcer, and the
# rest of the repo's CI tooling — exercised by `implementations/python/tests`.
# It is analyzed alongside the packages so SonarCloud sees it.
sonar.sources=implementations/python/packages,noxfile.py,tools,implementations/tooling/go
sonar.tests=implementations/python/tests,implementations/tooling/go
sonar.test.inclusions=implementations/python/tests/**,**/*_test.go
sonar.test.exclusions=**/testdata/**

# Exclusions
#
# The policy config (YAML/JSON/Rego) under `tools/policy/` is hand-authored
# governance data and stays analyzed now that `tools/` is a source root
# (issue #54).
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/build/**,\
  **/dist/**,\
  **/*.egg-info/**,\
  **/*_test.go,\
  **/testdata/**

# Python
#
# Match the project's declared support: `requires-python = ">=3.14,<3.15"` and
# Ruff `target-version = "py314"`. CPython 3.14 is the only interpreter that
# CI qualifies (#1672).
sonar.python.version=3.14

# Rule/profile alignment
#
# The repo lint contract is Python 3.14 with Ruff pyupgrade enabled.  Keep
# Sonar from reporting rules that conflict with that contract or with deliberate
# compatibility re-export surfaces.
sonar.issue.ignore.multicriteria=e1,e3,e4,e6,e7,e9,e10

sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1722
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.e3.ruleKey=python:S1720
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1128
sonar.issue.ignore.multicriteria.e4.resourceKey=implementations/python/packages/raes_processor/models/__init__.py

# The flagged "/tmp" literal is the target of a PRIVATE bubblewrap tmpfs mount
# inside the proof sandbox (`--tmpfs /tmp`), not a shared host directory. The
# same line already carries a justified Bandit suppression (noqa: S108).
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.e6.resourceKey=tools/isabelle_tool.py

# The repo lint contract (Ruff) requires targeted `noqa` suppressions, each
# carrying an inline justification; tracking every such suppression as a new
# quality-gate violation conflicts with that contract (same shape as e1-e4).
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S1309
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.py

# isabelle_tool.py's exact bytes are digest-pinned by the participant-opacity
# proof evidence manifest (specs/formal/participant-semantics/
# participant-opacity-proof-evidence.json, enforced by
# check_participant_opacity_proof.py). Cosmetic lint edits would invalidate
# recorded proof evidence, so its residual style findings are exempted instead
# of re-certifying the proof: e9 covers the redundant-exception-class smell,
# e10 the legacy noqa comment format.
sonar.issue.ignore.multicriteria.e9.ruleKey=python:S5713
sonar.issue.ignore.multicriteria.e9.resourceKey=tools/isabelle_tool.py

sonar.issue.ignore.multicriteria.e10.ruleKey=python:S7632
sonar.issue.ignore.multicriteria.e10.resourceKey=tools/isabelle_tool.py

# Coverage
sonar.python.coverage.reportPaths=implementations/python/coverage.xml
sonar.go.coverage.reportPaths=implementations/tooling/go/cover.out
