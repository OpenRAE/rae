# SonarCloud Configuration
# https://sonarcloud.io/project/overview?id=Brad-Edwards_aces

sonar.projectKey=Brad-Edwards_aces
sonar.organization=brad-edwards

# Quality gate (issue #527): make the scanner wait for the SonarCloud quality
# gate and fail the CI `sonar` job when the gate fails, so nothing merges past a
# failing gate. The assigned gate `raes-strict` fails on any new issue (plus
# new-code rating/coverage/duplication/hotspot conditions), mirroring
# `moonbase-strict`.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Source and test directories
#
# `tools/` (issue #54) is real production code — the ADR-015 policy gates,
# contract-schema generator/checker, requirement-governance enforcer, and the
# rest of the repo's CI tooling — exercised by `implementations/python/tests`.
# It is analyzed alongside the packages so SonarCloud sees it.
sonar.sources=implementations/python/packages,noxfile.py,tools
sonar.tests=implementations/python/tests

# Exclusions
#
# `tools/real-daemon/evidence/**` holds generated hardware-certification run
# records (timestamped JSON captured by the smoke scripts), not hand-written
# source — keep it out of analysis now that `tools/` is a source root (issue
# #54). The policy config (YAML/JSON/Rego) under `tools/policy/` is
# hand-authored governance data and stays analyzed.
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/build/**,\
  **/dist/**,\
  **/*.egg-info/**,\
  tools/real-daemon/evidence/**

# Copy/paste (CPD) exclusions (RUN-314).
#
# The reference emulation backend's orchestrator/evaluator/participant-runtime
# components intentionally reproduce the SAME portable runtime envelopes
# (workflow/evaluation/participant result + history) as the non-normative
# in-memory stub in raes_backend_stubs. That structural parallel is by design:
# the reference backend is a standalone, independently-readable implementation
# of the published backend contracts, and its parity with the stub is asserted
# directly by tests (test_reference_backend_conformance.py). Coupling the
# canonical reference backend to shared helpers with the throwaway stub would be
# worse design, so this duplication is accepted here rather than factored out.
# The driver-backed provisioner (the part that makes this backend "real") is NOT
# excluded and is held to the normal duplication bar.
sonar.cpd.exclusions=\
  implementations/python/packages/raes_reference_backend/orchestrator.py,\
  implementations/python/packages/raes_reference_backend/evaluator.py,\
  implementations/python/packages/raes_reference_backend/participant_runtime.py

# Python
#
# Match the project's declared support: `requires-python = ">=3.11,<3.15"` and
# Ruff `target-version = "py311"`. Declaring the full 3.11–3.14 range keeps
# SonarCloud's rules aligned with the interpreters CI actually qualifies
# (#1134 qualified CPython 3.14) while the 3.11 floor still gates
# newer-syntax suggestions on the lint contract (issue #54).
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Rule/profile alignment
#
# The repo lint contract is Python 3.11+ with Ruff pyupgrade enabled.  Keep
# Sonar from reporting rules that conflict with that contract or with deliberate
# compatibility re-export surfaces.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12

sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1722
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.e2.ruleKey=python:S6796
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.e3.ruleKey=python:S1720
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.py

sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1128
sonar.issue.ignore.multicriteria.e4.resourceKey=implementations/python/packages/raes_processor/models/__init__.py

# Generated libvirt boot artifacts must be readable by the QEMU process.
# The appliance builder never writes secrets to those kernel/initramfs artifacts.
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S2612
sonar.issue.ignore.multicriteria.e5.resourceKey=implementations/python/packages/raes_backend_libvirt/techvault_appliance.py

# The flagged "/tmp" literal is the target of a PRIVATE bubblewrap tmpfs mount
# inside the proof sandbox (`--tmpfs /tmp`), not a shared host directory. The
# same line already carries a justified Bandit suppression (noqa: S108).
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.e6.resourceKey=tools/isabelle_tool.py

# The repo lint contract (Ruff) requires targeted `noqa` suppressions, each
# carrying an inline justification; tracking every such suppression as a new
# quality-gate violation conflicts with that contract (same shape as e1-e4).
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S1309
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.py

# The hardware-certification smoke scenario authors fixed RFC-1918 lab
# addresses for real libvirt networks; they are scenario data, not service
# endpoints, and must stay stable across certification runs.
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.e8.resourceKey=tools/real-daemon/**

# isabelle_tool.py's exact bytes are digest-pinned by the participant-opacity
# proof evidence manifest (specs/formal/participant-semantics/
# participant-opacity-proof-evidence.json, enforced by
# check_participant_opacity_proof.py). Cosmetic lint edits would invalidate
# recorded proof evidence, so its residual style findings are exempted instead
# of re-certifying the proof: e9 covers the redundant-exception-class smell,
# e10 the legacy noqa comment format.
sonar.issue.ignore.multicriteria.e9.ruleKey=python:S5713
sonar.issue.ignore.multicriteria.e9.resourceKey=tools/isabelle_tool.py

sonar.issue.ignore.multicriteria.e10.ruleKey=python:S7632
sonar.issue.ignore.multicriteria.e10.resourceKey=tools/isabelle_tool.py

# These command modules intentionally keep the full closed-schema policy and
# qualification flow together so reviewers can audit one authoritative surface.
# Their functions carry narrow line-level suppressions for branch metrics; only
# the file-size metric needs a file-scoped exception.
sonar.issue.ignore.multicriteria.e11.ruleKey=python:S104
sonar.issue.ignore.multicriteria.e11.resourceKey=tools/bootstrap_profile.py

sonar.issue.ignore.multicriteria.e12.ruleKey=python:S104
sonar.issue.ignore.multicriteria.e12.resourceKey=tools/tooling_artifact_policy_artifacts.py

# Coverage
sonar.python.coverage.reportPaths=implementations/python/coverage.xml
