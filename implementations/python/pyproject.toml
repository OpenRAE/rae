[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "raes"
description = "Contracts and reference tooling for reproducible agentic environments."
dynamic = ["readme", "version"]
requires-python = ">=3.11,<3.15"
# Trove classifiers are the only source PyPI and downstream badges read for
# supported interpreter versions; `requires-python` alone leaves them blank.
# Keep this list in step with `requires-python`.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12.0",
    "click>=8.3.3",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "cryptography>=50.0.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
    "asyncssh>=2.23.0",
    "mcp>=1.28.1,<3",
    # Typed domain-profile validation is deliberately pinned to one inert,
    # in-process Draft 2020-12 implementation (issue #1202).
    "jsonschema==4.26.0",
    "packaging>=23.0",
    "rfc8785>=0.1.4,<0.2",
    "blake3>=1.0.8,<2",
    # Pinned to the governed raes-z3-finite-domain/v1 solver profile. The
    # published scenario-satisfiability-evidence-v1 schema and
    # SolverConfigurationModel both require package_version 4.16.0.0 /
    # engine_version 4.16.0, so bumping this without re-pinning that governed
    # profile makes formal satisfiability evidence unreproducible.
    "z3-solver==4.16.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "coverage>=7.0.0",
    "httpx>=0.27.0",
    "hypothesis>=6.0.0",
]
docs = [
    "sphinx>=7.3.0",
    "furo>=2024.5.6",
    "myst-parser>=3.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autobuild>=2024.4.16",
    "sphinx-reredirects==1.1.0",
]

[project.scripts]
raes = "raes_cli.entrypoint:main"
raes-mcp = "raes_mcp.server:main"

# Version is sourced from the dedicated RAES package file below. Release Please
# rewrites that file, keeping routine release bumps out of this package metadata;
# `raes.__version__` derives from the installed distribution metadata.

[tool.hatch.version]
path = "packages/raes/_version.py"

# The PyPI long description (`readme`) is injected from the repo-root README.md by
# a custom metadata hook (hatch_build.py), so there is a single README source and
# no duplicate copy under implementations/python.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/raes_contracts",
    "packages/raes_backend_protocols",
    "packages/raes_backend_stubs",
    "packages/raes_backend_libvirt",
    "packages/raes_operations",
    "packages/raes_reference_backend",
    "packages/raes_cli",
    "packages/raes_conformance",
    "packages/raes_mcp",
    "packages/raes_processor",
    "packages/raes_runtime",
    "packages/raes",
]

# Ship the published contract corpus (the ADR-009 normative authority at the
# repo-root `contracts/` tree) as package data so conformance + SDL semantic
# validation work from an installed wheel. The corpus is resolved at runtime
# via `importlib.resources` in `raes_contracts.corpus`; `contracts/` stays the
# single source of truth — this is a build-time distribution copy only.
#
# A custom build hook (hatch_build.py) force-includes the corpus into the wheel
# at `raes_contracts/_corpus`, resolving it from the source checkout
# (`../../contracts`) or from the corpus vendored into the sdist below — so both
# a direct wheel build and `uv build`'s sdist→wheel path produce a wheel that
# contains the corpus. The sdist vendors the corpus at top-level `_corpus/`.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"../../contracts" = "_corpus"
"../../README.md" = "README.md"
"../../THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../..", "src", "packages", "tests"]
markers = [
    "fuzz: property-based fuzz tests (run with: pytest -m fuzz)",
    "integration: subprocess, build, installed-distribution, or whole-system tests (run with: pytest -m integration)",
    "docker: opt-in tests that require a real container runtime (run with: pytest -m docker / nox -s integration_docker)",
]
addopts = "-m 'not fuzz and not integration and not docker'"
timeout = 120

[tool.coverage.run]
branch = true
relative_files = false
source = ["../.."]
omit = [
    "*/.cache/*",
    "*/docs/*",
    "*/implementations/python/.venv/*",
    "*/implementations/tooling/python/.venv/*",
    "*/implementations/python/tests/*",
]

[tool.coverage.report]
show_missing = true
include_namespace_packages = true
exclude_also = [
    # The reference backend's OCI subprocess leaf (RUN-314): real container
    # IO, exercised only by the opt-in docker integration tests, never in the
    # hermetic suite.
    "def _default_runner",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",   # assert is fine in tests and dataclass contracts
    "S603",   # subprocess without shell=True is fine
    "S607",   # partial executable path is fine
    "E501",   # line length handled by formatter, not linter
    "UP042",  # (str, Enum) is the established pattern; StrEnum migration is separate
    "SIM102", # nested if merging — harms readability in complex conditionals
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "E402", "SIM105", "F841"]
"packages/raes_contracts/contracts/__init__.py" = ["F403", "F405"]  # intentional package re-exports
"packages/raes_cli/**" = ["B008"]      # typer requires function calls in defaults
"packages/raes_runtime/control_plane.py" = ["S112"]      # intentional exception suppression
"packages/raes/module_registry/__init__.py" = ["S310", "S202", "F401"]  # S310/S202: explicit OCI URL fetch + tar extract; F401: intentional facade re-exports
"packages/raes_runtime/control_plane_api/__init__.py" = ["F401"]  # intentional facade re-exports (_receipt_response)
"packages/raes_mcp/tools/authoring/__init__.py" = ["F401"]  # intentional facade re-export (register)
"packages/raes_mcp/tools/inspection/__init__.py" = ["F401"]  # intentional facade re-export (register)
"packages/raes/semantics/objective_semantics/__init__.py" = ["F401"]  # intentional facade re-exports
"packages/raes/semantics/participant_behavior/__init__.py" = ["F401"]  # intentional facade re-exports
"packages/raes/composition/__init__.py" = ["F401"]  # intentional facade re-exports
"packages/raes/orchestration/__init__.py" = ["F401"]  # intentional facade re-exports
"packages/raes/participant_behavior/__init__.py" = ["F401"]  # intentional facade re-exports
"packages/raes_contracts/realization_envelope.py" = ["E402"]  # late import breaks a carrier dependency cycle
