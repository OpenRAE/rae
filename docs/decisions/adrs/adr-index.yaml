# Accepted-ADR manifest (ADR-059).
#
# Each entry names one accepted ADR and mirrors its `## Amendments` refs.
# tools/check_adr_immutability.py compares each accepted ADR with the base
# revision: a change to its canonical content must add a `## Amendments` row in
# the same change, or the ADR is superseded by a new ADR. No content digest is
# stored; git holds the ADR history (issue #1929).
adrs:
  - id: ADR-000
    path: docs/decisions/adrs/adr-000-use-adrs.md
  - id: ADR-001
    path: docs/decisions/adrs/adr-001-scenario-description-language.md
    amendments:
      - date: 2026-07-11
        ref: "#721"
        summary: "Replaced implicit case-insensitive field parsing with strict sdl-yaml/v1, explicit diagnosed migration, an honest normalized-authoring-object schema boundary, and RFC 8785 semantic identity."
      - date: 2026-09-09
        ref: "#989"
        summary: "Replace native vulnerability and classification sections with generic external concept bindings, preserving native execution semantics, explicit migration, and ordinary participant disclosure."
  - id: ADR-002
    path: docs/decisions/adrs/adr-002-declarative-sdl-objectives.md
    amendments:
      - date: 2026-07-05
        ref: "#682"
        summary: "Per ADR-073, narrowed the objective-success clause to reference observable state (conditions) only; the OCR scoring pipeline (metrics/evaluations/tlos/goals) was removed from the SDL and graded scoring/reward moved to the experiment/evaluator plane (ADR-055/064/069)."
      - date: 2026-07-12
        ref: "#725"
        summary: "Per ADR-079, corrected the condition/proposition conflation: objective success composes assertions over typed propositions; conditions are probe realizations only."
      - date: 2026-09-21
        ref: "#1338"
        summary: "Per ADR-109, separate organizational ownership and participant assignment, require declared action contracts, and retain realized-attribution boundaries."
