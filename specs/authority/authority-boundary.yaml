# Normative artifact authority boundary (ASR-517)
#
# This manifest records the authority boundary from ADR-009.
# ADR-019 governs this machine-readable form.
# Read these sources:
#   docs/decisions/adrs/adr-009-normative-artifact-authority-and-repository-structure.md
#   docs/decisions/adrs/adr-019-normative-authority-boundary-manifest.md
#   docs/explain/reference/normative-artifact-authority.md
#
# tools/check_authority_boundary.py compares this file with ADR-009,
# contracts/README.md, and specs/README.md.
# A new normative family or root classification uses this existing manifest.

policy: normative-artifact-authority

requirement_refs:
  - ASR-517

adr_refs:
  - ADR-009
  - ADR-019

# Roots that carry normative authority. Artifacts under these roots are binding
# on the ecosystem and supersede any reference implementation or generator
# output. Each entry pins the root, the authority it bears, and the artifact
# family it owns.
authority_roots:
  - id: normative_prose
    root: specs/
    authority: normative prose specifications
    family: prose

  # The SDL authoring specification is explicitly registered as its own prose
  # root for discoverability (the language-neutral SDL authority an independent
  # implementation reads). It reuses the existing `prose` family rather than
  # introducing a new authority family; it is a child of `specs/` and bears the
  # same authority class.
  - id: normative_sdl_prose
    root: specs/sdl/
    authority: normative SDL authoring specification
    family: prose

  - id: normative_schemas
    root: contracts/schemas/
    authority: published JSON Schemas
    family: schemas

  - id: normative_fixtures
    root: contracts/fixtures/
    authority: conformance fixtures (valid and invalid payload corpora)
    family: fixtures

  - id: normative_profiles
    root: contracts/profiles/
    authority: capability and intended-use profile declarations
    family: profiles

  - id: normative_realization_envelopes
    root: contracts/realization-envelopes/
    authority: configuration-bound backend realization envelope declarations
    family: realization-envelopes

  - id: normative_concept_authority
    root: contracts/concept-authority/
    authority: concept-family and controlled-vocabulary authority artifacts
    family: concept-authority

  - id: normative_provenance
    root: contracts/provenance/
    authority: revision-pinned SDL lineage and third-party provenance records
    family: provenance

# Roots that are non-normative. These consume authority; they do not define it.
# A reference implementation, an explanatory doc, a worked example, a research
# note, and the tooling tree all live here. Adding a new top-level directory
# without classifying it (here or as a legacy entry) fails the gate.
non_normative_roots:
  - id: reference_implementations
    root: implementations/
    note: reference code only; no Python model defines ecosystem meaning

  - id: explanatory_docs
    root: docs/
    note: explanatory, tutorial, and migration material

  - id: worked_examples
    root: examples/
    note: non-normative worked examples; not used for conformance

  - id: research_notes
    root: research/
    note: non-normative research material

  - id: process_notes
    root: notes/
    note: non-normative process notes

  - id: tooling
    root: tools/
    note: maintenance, codegen, and release helpers

  - id: documentation_styles
    root: styles/
    note: non-normative documentation lint rules and project vocabulary

# Top-level directories explicitly transitioned out by ADR-009. The gate fails
# if any of these reappears at the repo root.
legacy_top_level_dirs:
  - schemas
  - conformance
  - src

# Schema authority direction (ADR-009 section 7): contracts/schemas/ owns the
# hand-governed published schemas and is bound to the publication manifest.
# The raes_contracts owning package and the generator drivers under tools/ are
# the reference implementation; tools/check_generated_schemas.py only proves
# that implementation generates an identical bundle (into a throwaway
# directory) — it does not define authority and never overwrites the published
# schemas. A schema change must carry a contract-facing change-ledger entry in
# the publication manifest. Published schemas may not live anywhere else, and
# reference implementations may not own schema files.
schema_authority:
  normative_root: contracts/schemas/
  publication_manifest: contracts/schema-publication-manifest.json
  forbidden_authority_roots:
    - implementations/
  forbidden_schema_filename_suffixes:
    - .schema.json

# Non-prose artifacts that live inside a normative authority root but carry a
# distinct, more specific authority family — a governed "surface" in the
# concept-authority sense (specs/concept-authority/concept-authority.md). The
# `specs/` root's default family is `prose`; an entry here classifies one exact
# file more specifically, so the artifact's authority class is decidable from
# this manifest alone rather than inferred from its containing root.
#
# Most-specific rule: an artifact path is strictly more specific than any root
# prefix, so an explicit `normative_artifact_families[].artifact` entry wins for
# that exact file and the containing root supplies the default for every other
# artifact — there is no parent/child ambiguity to resolve. Classifying the
# next governed profile is a single entry here plus a focused test; nothing
# else in the repo carries a parallel list.
normative_artifact_families:
  - id: agent_guidance_profile
    artifact: specs/agent-guidance/agent-guidance.yaml
    authority: agent-usable governance-guidance profile (AUT-811)
    family: governance-guidance
    requirement_refs:
      - AUT-811

  - id: deprecation_records
    artifact: specs/evolution/deprecation-records.yaml
    authority: ecosystem deprecation and lifecycle records (GOV-902)
    family: deprecation-records
    requirement_refs:
      - GOV-902
