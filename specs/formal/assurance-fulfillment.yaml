# Classification-Based Assurance Fulfillment Map (ASR-505, review FM-1, issue #485)
#
# Companion to specs/formal/assurance-policy.yaml. The policy file defines the
# FM0-FM3 ladder and the required artifact kinds per level (its self-description).
# This file records, per classified formal-spec subsystem under specs/formal/,
# whether each required artifact kind for that subsystem's FM level is actually
# DELIVERED (a concrete, non-empty repo path) or explicitly WAIVED (an ISO date
# plus at least one tracking reference). It makes ADR-018's "the policy cannot rot
# silently" claim true for fulfillment, not just description: a subsystem can no
# longer be classified FM3 forever with no artifacts and a green CI.
#
# Required reading:
#   docs/decisions/adrs/adr-007-lightweight-formal-methods-policy.md  -- policy
#   docs/decisions/adrs/adr-018-classification-based-assurance-policy.md  -- seam
#   specs/formal/assurance-policy.yaml  -- the FM ladder and required artifacts
#
# Gated by tools/check_assurance_policy.py (nox -s policy / verify). Required
# artifact kinds are DERIVED from assurance-policy.yaml by FM level -- do not
# duplicate them here. Distinct from docs/explain/reference/fm-classification-
# ledger.yaml, which is the per-change ADR classification record.

fulfillment: classification-based-assurance-fulfillment

policy_ref: specs/formal/assurance-policy.yaml

adr_refs:
  - ADR-007
  - ADR-018
  - ADR-078
  - ADR-081
  - ADR-084
  - ADR-085
  - ADR-086
  - ADR-090
  - ADR-104

# Registry of classified formal-spec subsystems. Every immediate subdirectory of
# specs/formal/ carrying a README.md must appear here (the checker fails on any
# that is absent), and each must carry exactly one fulfillment entry below.
