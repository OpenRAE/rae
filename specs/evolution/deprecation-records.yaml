# Ecosystem Deprecation Records (GOV-902)
#
# Canonical, reviewable record surface for repository-governed deprecation and
# removal notices across ecosystem surfaces. Required reading:
#
#   specs/evolution/versioning-deprecation-and-migration.md
#     -- the normative operational policy (Deprecation / Removal sections);
#        each record below satisfies the complete-record contract it defines
#   docs/decisions/adrs/adr-075-ecosystem-versioning-deprecation-and-migration-governance.md
#     -- the architectural decision that mandates explicit deprecation records
#
# This file is a CI-time GOVERNANCE record surface, not a runtime lifecycle
# registry, migration service, persistence layer, or endpoint (ADR-075 forbids
# those). tools/check_deprecation_lifecycle.py validates every record against
# the 7-field contract and fails closed on an incomplete record, so
# supersession and removal stay predictable and reviewable (GOV-902). Each
# record points back to its owning surface's existing authority; it does not
# replace that authority. A deprecation is a lifecycle notice for a
# still-supported surface (status: deprecated); removal (status: removed) is
# allowed only after a record reaches its removal-eligibility rule, and for a
# published-json-schema surface it references the ADR-061 removed_schemas
# tombstone rather than duplicating it.
#
# Adding the next deprecation is one record here plus, when it is a new surface
# family, a row in the surface-class matrix — never a central runtime service.

policy: ecosystem-deprecation-records

requirement_refs:
  - GOV-902

adr_refs:
  - ADR-075

spec: specs/evolution/versioning-deprecation-and-migration.md

records:
  - id: independent-runtime-manager-owner
    surface_class: python-distribution
    identifier: "RuntimeManager's independent backend owner, implicit compensation after failed startup, and reuse of one owner across different plan run identities"
    status: removed
    first_notice: "Issue #1660 and ADR-104 section 11; raes 8.0.0 is the preceding independent-manager lineage"
    replacement: "One RuntimeControlPlane lifetime owner; RuntimeManager remains its compatibility name, with explicit immutable run scope and existing execution/recovery semantics"
    migration_reference: "docs/migration/runtime-lifetime.md; specs/sdl/execution-recovery.md; specs/formal/runtime-control-plane/supervision.md"
    notice_window: "Removal eligibility is the issue #1660 single-owner implementation, retained public manager lifecycle methods, explicit run-scope migration, and behavioral tests for post-apply evaluation and uncertainty exclusion. The RuntimeManager public name remains supported indefinitely."
    verification_evidence: "test_issue_1660_runtime_lifetime.py and test_runtime_manager.py verify single ownership, fresh evaluation, scoped retries, policy refusal before effects, failed-stop exclusion and retained committed state; existing reconciliation and participant tests verify their owning boundaries."
    removal_record: "Issue #1660 replaces the independent implementation and its conflicting failure behavior under ADR-104 section 11. No public symbol or published schema is removed."

  - id: sdl-participant-identity-relations
    surface_class: sdl-scenario-module
    identifier: "Agent.entity; Objective.agent and Objective.entity; objectives.agent/entity variation slots"
    status: removed
    first_notice: "Issue #1338 and proposed ADR-109 participant identity/assignment contract"
    replacement: "Optional affiliations and role; objective owner and assigned_participant; matching variation slots"
    migration_reference: "docs/migration/participant-identity.md; specs/sdl/participant-identity.md"
    notice_window: "Removal eligibility is explicit deterministic migration with source-digest-bound organizational decisions, atomic refusal tests, and canonical schema/compiler exclusion. The explicit pre-1338 source reader remains supported indefinitely until a separately reviewed notice establishes its removal window."
    verification_evidence: "test_issue_1338_identity_migration.py and test_issue_1338_participant_identity.py cover explicit decisions, stale-context refusal, preservation, closed canonical shape, and separate compiler projections."
    removal_record: "Issue #1338 satisfies the named contract-and-migrator eligibility rule. SDL fields are removed, not schema artifacts; affected draft schema lineages retain updated last_change records."

  - id: sdl-domain-classification-fields
    surface_class: sdl-scenario-module
    identifier: "vulnerabilities declarations and node/feature/entity associations; application-route vulnerability_refs; offensive_behavior_refs, ai_offensive_behavior_refs and defensive_behavior_refs; action external_mappings; entity categories"
    status: removed
    first_notice: "Issue #989 classification externalization contract, following external-concept-bindings/v1 in #986"
    replacement: "Native SDL plus standalone external-concept-bindings/v1 artifacts via migrate_sdl_classifications"
    migration_reference: "docs/migration/external-classifications.md; specs/concept-authority/classification-migration.md"
    notice_window: "Removal eligibility is the availability of the #986 generic contract, explicit deterministic migration with atomic refusals and loss reports, and canonical schema/compiler exclusion tests. The source migration reader remains supported for the pre-989 authoring lineage."
    verification_evidence: "test_classification_migration.py exercises source recognition, context-required refusal, deterministic conversion, native projection equality, binding admission and absence of canonical fields. Legacy source bytes remain available to the explicit migrator; canonical parsing fails with migration guidance."
    removal_record: "Issue #989 meets the named contract-and-migrator eligibility rule. This removes SDL fields, not a published schema artifact; the affected draft schema lineages remain published with updated last_change records."

  # The old PyPI project needs one final pointer release before archival. This
  # is distribution lifecycle, not an import compatibility promise: the final
  # release changes metadata and guidance only and does not restore old imports.
  - id: legacy-python-distribution
    surface_class: python-distribution
    identifier: "the legacy `aces-sdl` PyPI distribution, with 0.23.1 as its latest published release before the EOL pointer"
    status: deprecated
    first_notice: "ADR-093 and issue #907 (RAES rename and environment-pack naming convergence)"
    replacement: "the `raes` PyPI distribution and direct `raes` / `raes_*` imports"
    migration_reference: "docs/migration/raes-rename.md"
    notice_window: "Publish one final metadata-only 0.23.2 pointer release from the immutable 0.23.1 legacy lineage, verify it on PyPI, then archive the `aces-sdl` project. The archive is removal eligibility; no later fixes or releases are planned."
    verification_evidence: "The current pyproject and release workflow publish only `raes`; version and packaging tests reject the old command/import surface. The final legacy artifact must be verified separately for its exact name, version, unchanged code payload, EOL description, and `raes` replacement link before archival."

  # The module-import `path:` field, superseded by `source:` in ADR-053. The
  # parser still accepts it as a backward-compatible alias, normalizing it to
  # the `local:{path}` source form.
  - id: sdl-import-path-field
    surface_class: sdl-scenario-module
    identifier: "ImportDecl.path (the module-import `path:` field)"
    status: deprecated
    first_notice: "ADR-053 (SDL module composition for inventory-backed scenarios)"
    replacement: "the `source:` field (path form `local:{path}`)"
    migration_reference: "docs/decisions/adrs/adr-053-sdl-module-composition-for-inventory-backed-scenarios.md; docs/explain/sdl/parser.md"
    notice_window: "Supported indefinitely as a backward-compatible alias; removal eligible only after a complete removal record and a deterministic source rewrite per the migration rules."
    verification_evidence: "raes.scenario.ImportDecl.normalized_source maps a `path:` value to `local:{path}`, and validate_source_fields keeps deprecated-but-supported use non-fatal; parser tests exercise both the `source:` and `path:` forms."

  # Concrete backend realization moved to backend distributions (ADR-115). This
  # removes installed Python packages, modules, and commands from the `raes`
  # distribution; it removes no published schema and no contract fixture.
  - id: bundled-concrete-backends
    surface_class: python-distribution
    identifier: "the `raes_reference_backend` and `raes_backend_libvirt` packages, the backend workflow modules in `raes_operations`, `raes_conformance.conformance.reference_participant_opacity`, and the `raes libvirt` and `raes corpus` commands of the `raes` distribution"
    status: removed
    first_notice: "Issue #967 and ADR-115 (concrete backends are owned outside RAES); RAES 7.0.0 is the last release that bundles them"
    replacement: "LilRAE (PyPI `lilrae`, first independent release 8.1.0) for local realization; `raes_backend_stubs` for test doubles; the installed `raes_conformance.conformance` facade and `raes conformance backend` for conformance"
    migration_reference: "docs/migration/concrete-backends.md; docs/decisions/adrs/adr-115-concrete-backends-owned-outside-raes.md"
    notice_window: "Removal eligibility is an independently released, working backend distribution (LilRAE 8.1.0, pinned to the released RAES 6.0.1). The removal ships as a breaking change in the release after RAES 7.0.0. The libvirt backend has no successor; RAES 7.0.0 stays available for operators who must clean up its native resources."
    verification_evidence: "test_corpus_packaging.py builds the wheel and sdist and asserts that no concrete backend package or command ships, that `raes --help` works, and that the removed imports do not resolve from an installed wheel."
    removal_record: "Issue #967 removes the packages, commands, CI container lanes, and backend-only tooling in one change. Published schemas, contract fixtures, realization envelopes, and portable runtime contracts are unchanged."
